<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel - Video Control</title>
    <style>
        body { font-family: system-ui; max-width: 400px; margin: 2rem auto; padding: 1rem; background: #111; color: #eee; text-align: center; }
        .status { padding: 1rem; margin: 1rem 0; border-radius: 8px; background: #222; }
        .playing { color: #4caf50; }
        .paused { color: #f44336; }
        button { padding: 0.8rem 2rem; margin: 0.5rem; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
        #pauseBtn { background: #f44336; color: white; }
        #playBtn { background: #4caf50; color: white; }
        #pauseBtn:disabled, #playBtn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <h2>🎬 वीडियो नियंत्रण</h2>
    <div class="status" id="statusDisplay">
        <p>स्थिति: <span id="statusText" class="playing">लोड हो रहा है...</span></p>
    </div>
    <div>
        <button id="pauseBtn">⏸️ रोकें</button>
        <button id="playBtn" disabled>▶️ चलाएँ</button>
    </div>
    <p id="message"></p>

    <script>
        // ============================================================
        // 🔑 अपना Worker URL यहाँ डालें
        // ============================================================
        const WORKER_URL = "https://hls-d1-api.bbro75574-4c4.workers.dev";

        const statusText = document.getElementById('statusText');
        const pauseBtn = document.getElementById('pauseBtn');
        const playBtn = document.getElementById('playBtn');
        const messageEl = document.getElementById('message');

        // ============================================================
        // 📊 स्टेटस फेच करें और UI अपडेट करें
        // ============================================================
        async function fetchStatus() {
            try {
                const response = await fetch(`${WORKER_URL}/status`);
                if (!response.ok) throw new Error('Failed to fetch status');
                const data = await response.json();
                const status = data.value || 'playing';
                updateUI(status);
            } catch (error) {
                console.error('Error fetching status:', error);
                messageEl.textContent = '⚠️ स्टेटस फेच करने में त्रुटि';
            }
        }

        // ============================================================
        // 🎨 UI अपडेट करें
        // ============================================================
        function updateUI(status) {
            if (status === 'playing') {
                statusText.textContent = '▶️ चल रहा है';
                statusText.className = 'playing';
                pauseBtn.disabled = false;
                playBtn.disabled = true;
            } else if (status === 'paused' || status === 'blank') {
                statusText.textContent = '⏸️ रुका हुआ';
                statusText.className = 'paused';
                pauseBtn.disabled = true;
                playBtn.disabled = false;
            } else {
                statusText.textContent = '❓ अज्ञात';
                statusText.className = '';
                pauseBtn.disabled = true;
                playBtn.disabled = true;
            }
            messageEl.textContent = '';
        }

        // ============================================================
        // ✏️ स्टेटस अपडेट करें (API को कॉल करें)
        // ============================================================
        async function updateStatus(newStatus) {
            const action = newStatus === 'playing' ? 'चला' : 'रोका';
            messageEl.textContent = `⏳ ${action} जा रहा है...`;
            try {
                const response = await fetch(`${WORKER_URL}/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                if (!response.ok) throw new Error('Update failed');
                const data = await response.json();
                if (data.success) {
                    messageEl.textContent = `✅ वीडियो ${action} दिया गया!`;
                    fetchStatus(); // तुरंत स्टेटस रिफ्रेश करें
                } else {
                    throw new Error('API returned error');
                }
            } catch (error) {
                console.error('Error updating status:', error);
                messageEl.textContent = `❌ ${action}ने में त्रुटि`;
                fetchStatus(); // स्टेटस वापस रिफ्रेश करें
            }
        }

        // ============================================================
        // 🔘 बटन इवेंट्स
        // ============================================================
        pauseBtn.addEventListener('click', () => updateStatus('paused'));
        playBtn.addEventListener('click', () => updateStatus('playing'));

        // ============================================================
        // 🚀 पेज लोड होने पर और हर 5 सेकंड में स्टेटस चेक करें
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            fetchStatus();
            setInterval(fetchStatus, 5000);
        });
    </script>
</body>
</html>
