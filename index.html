<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लाइव स्ट्रीम</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a2a4e;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .live-badge {
            background: #ff0000;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            animation: blink 1.2s infinite;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-badge::before {
            content: "●";
            font-size: 18px;
            animation: pulse 1s infinite;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.8);
            }
        }

        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            width: 100%;
        }

        #videoPlayer {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            padding: 12px 18px;
            background: #12122a;
            border-radius: 12px;
            border: 1px solid #2a2a4e;
            flex-wrap: wrap;
            gap: 10px;
        }

        .viewer-count {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
        }

        .viewer-count .number {
            font-weight: 800;
            font-size: 22px;
            background: linear-gradient(135deg, #00c6fb, #005bea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        .status-text {
            color: #00ff88;
            font-weight: 600;
            font-size: 15px;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #555;
            font-size: 13px;
            border-top: 1px solid #1a1a3e;
            padding-top: 18px;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 8px;
            padding: 10px 16px;
            background: rgba(255, 0, 0, 0.1);
            border-radius: 10px;
            border-left: 3px solid #ff6b6b;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            .header h1 {
                font-size: 18px;
            }
            .status-bar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>📺 लाइव स्ट्रीम</h1>
            <div class="live-badge">लाइव</div>
        </div>

        <div class="video-wrapper">
            <video id="videoPlayer" controls playsinline autoplay preload="auto"></video>
        </div>

        <div class="status-bar">
            <div class="viewer-count">
                <span class="status-dot"></span>
                <span class="status-text">लाइव चल रहा है</span>
            </div>
            <div class="viewer-count">
                <span class="label">👁️ देख रहे हैं:</span>
                <span class="number" id="viewerCount">0</span>
            </div>
        </div>

        <div id="errorMsg" class="error-msg">❌ वीडियो लोड नहीं हुआ।</div>
        <div class="footer">⚡ Render पर होस्ट किया गया</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        // ============================================================
        // 🔴 बस इस एक लाइन में अपना .m3u8 लिंक डालें
        // ============================================================
        const DEFAULT_VIDEO_URL = "https://vs.classplusapp.com/hls/6a7089aae86acfbc9dbb33f5/index.m3u8";

        let hls = null;
        let reloadAttempts = 0;
        const MAX_RELOAD_ATTEMPTS = 100;

        const video = document.getElementById('videoPlayer');
        const viewerCountEl = document.getElementById('viewerCount');
        const errorMsg = document.getElementById('errorMsg');

        // ============================================================
        // 👁️ लाइव व्यूअर काउंट
        // ============================================================
        function startViewerCounter() {
            let count = Math.floor(Math.random() * 40) + 12;
            viewerCountEl.textContent = count;

            setInterval(() => {
                let change = Math.floor(Math.random() * 7) - 3;
                let newCount = parseInt(viewerCountEl.textContent) + change;
                if (newCount < 5) newCount = 5 + Math.floor(Math.random() * 10);
                if (newCount > 150) newCount = 120 + Math.floor(Math.random() * 30);
                viewerCountEl.textContent = newCount;
            }, 7000);
        }
        startViewerCounter();

        // ============================================================
        // 🎬 वीडियो लोड करें
        // ============================================================
        function loadVideo(url) {
            if (!url) {
                errorMsg.textContent = "❌ URL खाली है!";
                errorMsg.classList.add('show');
                return;
            }

            errorMsg.classList.remove('show');

            if (hls) {
                hls.destroy();
                hls = null;
            }

            // Safari / iOS
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play().catch(function(e) {
                    console.warn('Autoplay blocked:', e);
                });
                return;
            }

            // बाकी ब्राउज़र
            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    maxBufferLength: 60,
                    maxMaxBufferLength: 120,
                    maxBufferSize: 60 * 1000 * 1000,
                    startFragPrefetch: true,
                    testBandwidth: true,
                    abrEwmaDefaultEstimate: 500000,
                    abrEwmaFastLive: 3.0,
                    abrEwmaSlowLive: 9.0,
                    liveDurationInfinity: true,
                    liveMaxLatencyDurationCount: 5,
                    liveSyncDurationCount: 5,
                    fragLoadingTimeOut: 30000,
                    manifestLoadingTimeOut: 30000,
                    levelLoadingTimeOut: 30000,
                });

                hls.loadSource(url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    console.log('✅ मैनिफेस्ट पार्स हो गया');
                    video.play().catch(function(e) {
                        console.warn('Autoplay blocked:', e);
                    });
                });

                hls.on(Hls.Events.ERROR, function(event, data) {
                    console.log('⚠️ एरर:', data.type, data.details);

                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.log('🔄 नेटवर्क एरर, रिकवर कर रहे हैं...');
                                hls.startLoad();
                                break;

                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.log('🔄 मीडिया एरर, रिकवर कर रहे हैं...');
                                hls.recoverMediaError();
                                break;

                            default:
                                if (reloadAttempts < MAX_RELOAD_ATTEMPTS) {
                                    reloadAttempts++;
                                    console.log(`🔄 रिलोड ${reloadAttempts}/${MAX_RELOAD_ATTEMPTS}...`);
                                    setTimeout(function() {
                                        loadVideo(url);
                                    }, 3000);
                                } else {
                                    errorMsg.textContent = "❌ बार-बार रिलोड करने पर भी वीडियो नहीं चल रहा। नया लिंक डालें।";
                                    errorMsg.classList.add('show');
                                }
                                break;
                        }
                    }
                });

                hls.on(Hls.Events.BUFFER_STALLED, function() {
                    console.log('🔄 बफर स्टॉल हो गया, रिकवर कर रहे हैं...');
                    if (hls) {
                        hls.startLoad();
                    }
                });

            } else {
                errorMsg.textContent = "❌ आपका ब्राउज़र HLS सपोर्ट नहीं करता।";
                errorMsg.classList.add('show');
            }
        }

        // ============================================================
        // 🚀 पेज लोड होने पर वीडियो लोड करें
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            if (DEFAULT_VIDEO_URL && DEFAULT_VIDEO_URL !== "https://example.com/stream.m3u8") {
                loadVideo(DEFAULT_VIDEO_URL);
            } else {
                errorMsg.textContent = "❌ कृपया DEFAULT_VIDEO_URL में .m3u8 लिंक डालें।";
                errorMsg.classList.add('show');
            }
        });

        console.log('✅ लाइव स्ट्रीम वेबसाइट तैयार है!');
        console.log('📺 लिंक:', DEFAULT_VIDEO_URL);
    </script>

</body>
</html>
