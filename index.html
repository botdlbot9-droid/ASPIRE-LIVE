<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Live Stream - Verification</title>
    <link href="https://unpkg.com/video.js@8/dist/video-js.min.css" rel="stylesheet">
    <script src="https://unpkg.com/video.js@8/dist/video.min.js"></script>
    <script src="https://unpkg.com/@videojs/http-streaming@3/dist/videojs-http-streaming.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* ================================================================
           CSS - Full Dark Theme (Verification + Player)
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #2a2a4e;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .hidden {
            display: none !important;
        }

        /* ===== VERIFICATION PAGE ===== */
        #verificationPage {
            max-width: 500px;
            margin: 40px auto;
            text-align: center;
        }

        .verify-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .verify-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .verify-subtitle {
            color: #a0a0b8;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .verify-input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid #2a2a4e;
            background: #0f0f23;
            color: #fff;
            font-size: 20px;
            text-align: center;
            letter-spacing: 6px;
            font-weight: 700;
            outline: none;
            transition: 0.3s;
            font-family: 'Segoe UI', sans-serif;
        }

        .verify-input:focus {
            border-color: #f7971e;
            box-shadow: 0 0 0 3px rgba(247, 151, 30, 0.15);
        }

        .verify-input::placeholder {
            letter-spacing: 0;
            font-weight: 400;
            color: #6a6a8a;
            font-size: 14px;
        }

        .verify-btn {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #0a0a12;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Segoe UI', sans-serif;
        }

        .verify-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(247, 151, 30, 0.35);
        }

        .verify-error {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 12px;
            min-height: 20px;
        }

        .verify-success {
            color: #00ff88;
            font-size: 14px;
            margin-top: 12px;
            min-height: 20px;
        }

        /* ===== PLAYER PAGE ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .live-badge {
            background: #ff0044;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            animation: blink 1.2s infinite;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-badge::before {
            content: "●";
            font-size: 16px;
            animation: pulse 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .player-wrapper {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            width: 100%;
            margin-bottom: 20px;
        }

        #my-video {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
            background: #12121e;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid #2a2a4e;
            margin-bottom: 16px;
        }

        .btn {
            padding: 12px 36px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Segoe UI', sans-serif;
        }

        .btn-live {
            background: linear-gradient(135deg, #ff0044, #cc0033);
            color: #fff;
            box-shadow: 0 4px 20px rgba(255, 0, 68, 0.4);
        }

        .btn-live:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255, 0, 68, 0.6);
        }

        .btn-live .pulse-ring {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            animation: pulse-ring 1.5s infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        .btn-refresh {
            background: #0f0f23;
            border: 1px solid #2a2a4e;
            color: #a0a0b8;
            padding: 12px 20px;
        }

        .btn-refresh:hover {
            border-color: #f7971e;
            color: #fff;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 16px;
            background: #12121e;
            border-radius: 10px;
            border: 1px solid #2a2a4e;
            margin-bottom: 16px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .status-item .label {
            color: #a0a0b8;
        }

        .status-item .value {
            font-weight: 600;
            color: #00ff88;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        .message {
            font-size: 14px;
            padding: 10px 16px;
            border-radius: 8px;
            display: none;
            margin-bottom: 12px;
        }

        .message.show {
            display: block;
        }

        .message.error {
            color: #ff6b6b;
            background: rgba(255, 0, 0, 0.08);
            border-left: 3px solid #ff6b6b;
        }

        .message.success {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.08);
            border-left: 3px solid #00ff88;
        }

        .message.info {
            color: #f7971e;
            background: rgba(247, 151, 30, 0.08);
            border-left: 3px solid #f7971e;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #6a6a8a;
            font-size: 13px;
            border-top: 1px solid #1a1a3e;
            padding-top: 18px;
        }

        .footer .highlight {
            color: #f7971e;
        }

        @media (max-width: 768px) {
            .container { padding: 16px; }
            .controls-bar { flex-direction: column; }
            .btn { justify-content: center; width: 100%; }
            .status-bar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="container" id="appContainer">

        <!-- ========================================================== -->
        <!-- 🔐 VERIFICATION PAGE -->
        <!-- ========================================================== -->
        <div id="verificationPage">
            <div class="verify-icon">🔑</div>
            <div class="verify-title">Access Code Required</div>
            <div class="verify-subtitle">Enter your one-time access key to watch the live stream</div>
            <input type="text" class="verify-input" id="keyInput" placeholder="Enter 8-digit key" maxlength="8" autofocus>
            <button class="verify-btn" onclick="verifyKey()">🔓 Unlock Stream</button>
            <div id="verifyMessage" class="verify-error"></div>
        </div>

        <!-- ========================================================== -->
        <!-- 🎬 PLAYER PAGE (Hidden by default) -->
        <!-- ========================================================== -->
        <div id="playerPage" class="hidden">

            <!-- Header -->
            <div class="header">
                <h1>📺 Live Stream</h1>
                <div class="live-badge">लाइव</div>
            </div>

            <!-- Video Player -->
            <div class="player-wrapper">
                <video id="my-video" class="video-js vjs-big-play-centered vjs-16-9" 
                       controls preload="auto" playsinline
                       referrerpolicy="no-referrer">
                    <p class="vjs-no-js">Please enable JavaScript</p>
                </video>
            </div>

            <!-- Controls -->
            <div class="controls-bar">
                <button class="btn btn-live" onclick="loadLiveStream()">
                    <span class="pulse-ring"></span> लाइव देखें
                </button>
               
            </div>

            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-item">
                    <span class="status-dot"></span>
                    <span class="label">स्थिति:</span>
                    <span class="value" id="statusText">तैयार</span>
                </div>
                <div class="status-item">
                    <span class="label"><i class="fas fa-microchip"></i> प्लेयर:</span>
                    <span class="value" id="playerInfo">Video.js</span>
                </div>
            </div>

            <!-- Message -->
            <div id="message" class="message"></div>

            <!-- Footer -->
            <footer class="footer">
                <p>⚡ <span class="highlight">Secure Stream</span> — One-Time Access</p>
            </footer>
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT -->
    <!-- ============================================================ -->
    <script>
        /**
         * ================================================================
         *  🔐 SECURE LIVE STREAM - One-Time Verification Key
         *  - User must enter valid 8-digit key
         *  - Key can be used only once (stored in localStorage)
         *  - After verification, player is shown
         * ================================================================
         */

        // ============================================================
        // 🔑 CONFIGURATION
        // ============================================================

        // ⭐⭐⭐ CHANGE THESE KEYS AS YOU WANT ⭐⭐⭐
        // आप चाहें तो इनमें से किसी भी key को use कर सकते हैं
        const VALID_KEYS = [
            '12345678',
            '87654321',
            '11112222',
            '99998888',
            'LIVE2024',
            'STREAM01'
        ];

        // Video URL - अपना REAL .m3u8 लिंक डालें
        const VIDEO_URL = "https://vs.classplusapp.com/hls/6a7089aae86acfbc9dbb33f5/index.m3u8";

        // ============================================================
        // 📦 DOM REFS
        // ============================================================
        const verificationPage = document.getElementById('verificationPage');
        const playerPage = document.getElementById('playerPage');
        const keyInput = document.getElementById('keyInput');
        const verifyMessage = document.getElementById('verifyMessage');

        const statusText = document.getElementById('statusText');
        const playerInfo = document.getElementById('playerInfo');
        const messageEl = document.getElementById('message');

        // ============================================================
        // 🔐 VERIFICATION LOGIC
        // ============================================================

        function verifyKey() {
            const enteredKey = keyInput.value.trim();

            // Check if key is empty
            if (!enteredKey) {
                verifyMessage.textContent = '❌ Please enter an access key!';
                verifyMessage.className = 'verify-error';
                return;
            }

            // Check if key length is 8 characters (you can change this)
            if (enteredKey.length !== 8) {
                verifyMessage.textContent = '❌ Key must be exactly 8 characters!';
                verifyMessage.className = 'verify-error';
                return;
            }

            // Check if key has already been used
            const usedKeys = JSON.parse(localStorage.getItem('usedKeys') || '[]');
            if (usedKeys.includes(enteredKey)) {
                verifyMessage.textContent = '❌ This key has already been used!';
                verifyMessage.className = 'verify-error';
                return;
            }

            // Check if key is valid
            if (VALID_KEYS.includes(enteredKey)) {
                // ✅ Key is valid and unused
                // Mark key as used
                usedKeys.push(enteredKey);
                localStorage.setItem('usedKeys', JSON.stringify(usedKeys));

                // ✅ Success - Show player
                verifyMessage.textContent = '✅ Access granted! Loading stream...';
                verifyMessage.className = 'verify-success';

                // Hide verification, show player
                setTimeout(() => {
                    verificationPage.classList.add('hidden');
                    playerPage.classList.remove('hidden');
                    // Initialize player
                    initPlayer();
                    // Auto start stream
                    setTimeout(() => loadLiveStream(), 500);
                }, 800);

            } else {
                // ❌ Invalid key
                verifyMessage.textContent = '❌ Invalid access key! Please try again.';
                verifyMessage.className = 'verify-error';
                keyInput.value = '';
                keyInput.focus();
            }
        }

        // ============================================================
        // ⌨️ Enter Key Support on Input
        // ============================================================
        keyInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                verifyKey();
            }
        });

        // ============================================================
        // 🎬 VIDEO.JS PLAYER
        // ============================================================
        let player = null;

        function initPlayer() {
            if (player) {
                player.dispose();
                player = null;
            }

            player = videojs('my-video', {
                controls: true,
                autoplay: false,
                preload: 'auto',
                fluid: true,
                html5: {
                    hls: {
                        enableWorker: true,
                        lowLatencyMode: true,
                        maxBufferLength: 30,
                        xhrSetup: function(xhr, url) {
                            xhr.setRequestHeader('Referer', '');
                            try {
                                delete xhr._headers['Referer'];
                            } catch(e) {}
                            console.log('🔒 Referer removed for:', url);
                        }
                    }
                }
            });

            player.ready(function() {
                console.log('✅ Player Ready');
                statusText.textContent = '✅ तैयार';
                playerInfo.textContent = 'Live Player';
                showMessage('✅ प्लेयर तैयार है', 'success');
            });

            player.on('error', function() {
                const error = player.error();
                console.error('❌ Player Error:', error);
                showMessage(`❌ ${error.message || 'Unknown error'}`, 'error');
                statusText.textContent = '❌ एरर';
            });

            player.on('waiting', function() {
                statusText.textContent = '⏳ बफर...';
                showMessage('⏳ बफर हो रहा है...', 'info');
            });

            player.on('playing', function() {
                statusText.textContent = '✅ चल रहा है';
                hideMessage();
            });

            return player;
        }

        // ============================================================
        // 🎬 LOAD LIVE STREAM
        // ============================================================
        function loadLiveStream() {
            showMessage('⏳ लाइव स्ट्रीम लोड हो रहा है...', 'info');
            statusText.textContent = '⏳ लोड हो रहा है...';

            if (!player) {
                player = initPlayer();
            }

            try {
                player.src({
                    src: VIDEO_URL,
                    type: 'application/x-mpegURL'
                });
                player.play().catch(() => {
                    showMessage('⚠️ ऑटोप्ले ब्लॉक, प्ले बटन दबाएँ', 'info');
                });
                showMessage('✅ लाइव स्ट्रीम शुरू!', 'success');
            } catch (error) {
                console.error('❌ Load error:', error);
                showMessage('❌ ' + error.message, 'error');
            }
        }

        // ============================================================
        // 🔄 RESET PLAYER
        // ============================================================
        function resetPlayer() {
            if (player) {
                player.pause();
                player.reset();
                player.src({ src: '', type: '' });
                statusText.textContent = 'तैयार';
                playerInfo.textContent = 'Video.js + hls.js';
                hideMessage();
                showMessage('🔄 प्लेयर रीसेट हो गया', 'info');
            }
        }

        // ============================================================
        // 📢 MESSAGE HELPER
        // ============================================================
        function showMessage(msg, type) {
            messageEl.textContent = msg;
            messageEl.className = 'message show ' + (type || 'info');
            if (type === 'success' || type === 'info') {
                clearTimeout(messageEl._hideTimer);
                messageEl._hideTimer = setTimeout(() => {
                    messageEl.classList.remove('show');
                }, 5000);
            }
        }

        function hideMessage() {
            messageEl.classList.remove('show');
            clearTimeout(messageEl._hideTimer);
        }

        // ============================================================
        // 🚀 PAGE LOAD
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ Secure Live Stream initialized!');
            console.log('🔑 Valid Keys:', VALID_KEYS);
            console.log('📺 Video URL:', VIDEO_URL);
            console.log('🔒 Referer: REMOVED');
            console.log('💡 Each key can be used only once');
        });

        // ============================================================
        // 🔄 AUTO-RETRY - Stalled Recovery
        // ============================================================
        setInterval(function() {
            if (!player) return;
            try {
                const tech = player.tech({ IWillNotUseThisInPlugins: true });
                if (tech && tech.vhs) {
                    const vhs = tech.vhs;
                    if (vhs && vhs.buffer && vhs.buffer.length === 0 && !player.paused()) {
                        console.log('🔄 Buffer empty, reloading...');
                        player.src({ src: VIDEO_URL, type: 'application/x-mpegURL' });
                        player.play().catch(() => {});
                    }
                }
            } catch (e) {
                // Ignore
            }
        }, 5000);
    </script>

</body>
</html>
