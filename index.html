<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS Video Player - Embeddable</title>
    <!-- ============================================================ -->
    <!-- VIDEO.JS + HLS.JS - From the GitHub repo -->
    <!-- ============================================================ -->
    <link href="https://unpkg.com/video.js@8/dist/video-js.min.css" rel="stylesheet">
    <script src="https://unpkg.com/video.js@8/dist/video.min.js"></script>
    <script src="https://unpkg.com/@videojs/http-streaming@3/dist/videojs-http-streaming.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        /* ================================================================
           CSS - Dark Theme (as in the GitHub repo style)
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #2a2a4e;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        /* ----- Header ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .live-badge {
            background: #ff0044;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            animation: blink 1.2s infinite;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-badge::before {
            content: "●";
            font-size: 16px;
            animation: pulse 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        /* ----- Player Wrapper ----- */
        .player-wrapper {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            width: 100%;
            margin-bottom: 20px;
        }

        #my-video {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ----- Controls Bar (GitHub repo style) ----- */
        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            background: #12121e;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid #2a2a4e;
            margin-bottom: 16px;
        }

        .controls-bar .url-label {
            font-size: 13px;
            font-weight: 600;
            color: #a0a0b8;
        }

        .controls-bar .url-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #2a2a4e;
            background: #0f0f23;
            color: #fff;
            font-size: 14px;
            font-family: 'Segoe UI', sans-serif;
            outline: none;
            transition: 0.3s;
        }

        .controls-bar .url-input:focus {
            border-color: #f7971e;
        }

        .controls-bar .url-input::placeholder {
            color: #6a6a8a;
        }

        .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            font-family: 'Segoe UI', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #0a0a12;
        }

        .btn-primary:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 30px rgba(247, 151, 30, 0.35);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #2a2a4e;
            color: #a0a0b8;
        }

        .btn-outline:hover {
            border-color: #f7971e;
            color: #fff;
        }

        /* ----- Status Bar ----- */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 16px;
            background: #12121e;
            border-radius: 10px;
            border: 1px solid #2a2a4e;
            margin-bottom: 16px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .status-item .label {
            color: #a0a0b8;
        }

        .status-item .value {
            font-weight: 600;
            color: #00ff88;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        /* ----- Message ----- */
        .message {
            font-size: 14px;
            padding: 10px 16px;
            border-radius: 8px;
            display: none;
            margin-bottom: 12px;
        }

        .message.show {
            display: block;
        }

        .message.error {
            color: #ff6b6b;
            background: rgba(255, 0, 0, 0.08);
            border-left: 3px solid #ff6b6b;
        }

        .message.success {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.08);
            border-left: 3px solid #00ff88;
        }

        .message.info {
            color: #f7971e;
            background: rgba(247, 151, 30, 0.08);
            border-left: 3px solid #f7971e;
        }

        /* ----- Footer ----- */
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #6a6a8a;
            font-size: 13px;
            border-top: 1px solid #1a1a3e;
            padding-top: 18px;
        }

        .footer .highlight {
            color: #f7971e;
        }

        .footer a {
            color: #a0a0b8;
            text-decoration: none;
        }

        .footer a:hover {
            color: #f7971e;
        }

        /* ----- Responsive ----- */
        @media (max-width: 768px) {
            .container { padding: 16px; }
            .controls-bar { flex-direction: column; align-items: stretch; }
            .controls-bar .url-input { min-width: 100%; }
            .btn { justify-content: center; }
            .status-bar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <h1>📺 HLS Video Player</h1>
            <div class="live-badge">लाइव</div>
        </div>

        <!-- ===== VIDEO PLAYER ===== -->
        <div class="player-wrapper">
            <video id="my-video" class="video-js vjs-big-play-centered vjs-16-9" controls preload="auto" playsinline>
                <p class="vjs-no-js">
                    To view this video please enable JavaScript, and consider upgrading to a web browser that
                    <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>
                </p>
            </video>
        </div>

        <!-- ===== CONTROLS BAR (As per GitHub repo) ===== -->
        <div class="controls-bar">
            <span class="url-label"><i class="fas fa-link"></i> Video URL</span>
            <input type="text" class="url-input" id="videoUrlInput"
                   placeholder="https://example.com/stream.m3u8"
                   value="https://vs.classplusapp.com/hls/6a7089aae86acfbc9dbb33f5/index.m3u8">
            <button class="btn btn-primary" onclick="loadVideo()">
                <i class="fas fa-play"></i> Play
            </button>
            <button class="btn btn-outline" onclick="resetPlayer()">
                <i class="fas fa-undo-alt"></i> Reset
            </button>
        </div>

        <!-- ===== STATUS BAR ===== -->
        <div class="status-bar">
            <div class="status-item">
                <span class="status-dot"></span>
                <span class="label">स्थिति:</span>
                <span class="value" id="statusText">तैयार</span>
            </div>
            <div class="status-item">
                <span class="label"><i class="fas fa-eye"></i> दर्शक:</span>
                <span class="value" id="viewerCount">0</span>
            </div>
            <div class="status-item">
                <span class="label"><i class="fas fa-microchip"></i> प्लेयर:</span>
                <span class="value" id="playerInfo">Video.js + hls.js</span>
            </div>
        </div>

        <!-- ===== MESSAGE ===== -->
        <div id="message" class="message"></div>

        <!-- ===== FOOTER ===== -->
        <footer class="footer">
            <p>
                ⚡ <span class="highlight">HLS Video Player</span> —
                <a href="https://github.com/avinashkranjan/HLS_VideoPlayer" target="_blank">GitHub Repo</a>
                ·
                <i class="fas fa-heart" style="color: #ff0044;"></i>
                Made with ❤️
            </p>
        </footer>

    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT - As per GitHub repo structure -->
    <!-- ============================================================ -->
    <script>
        /**
         * ================================================================
         *  🎬 Embeddable HLS Video Player
         *  From: https://github.com/avinashkranjan/HLS_VideoPlayer
         *  - Video.js + hls.js
         *  - Query param support: ?video=URL&subtitle=URL
         * ================================================================
         */

        // ============================================================
        // 📦 DOM REFS
        // ============================================================
        const videoUrlInput = document.getElementById('videoUrlInput');
        const statusText = document.getElementById('statusText');
        const viewerCountEl = document.getElementById('viewerCount');
        const playerInfo = document.getElementById('playerInfo');
        const messageEl = document.getElementById('message');

        // ============================================================
        // 🎬 VIDEO.JS PLAYER
        // ============================================================
        let player = null;

        function initPlayer() {
            if (player) {
                player.dispose();
                player = null;
            }

            player = videojs('my-video', {
                controls: true,
                autoplay: false,
                preload: 'auto',
                fluid: true,
                html5: {
                    hls: {
                        enableWorker: true,
                        lowLatencyMode: true,
                        maxBufferLength: 30,
                    }
                }
            });

            // --- Player Events ---
            player.ready(function() {
                console.log('✅ Video.js Player Ready');
                statusText.textContent = '✅ तैयार';
                playerInfo.textContent = 'Video.js + hls.js';
                showMessage('✅ प्लेयर तैयार है', 'success');
            });

            player.on('error', function() {
                const error = player.error();
                console.error('❌ Player Error:', error);
                showMessage(`❌ ${error.message || 'Unknown error'}`, 'error');
                statusText.textContent = '❌ एरर';
            });

            player.on('waiting', function() {
                statusText.textContent = '⏳ बफर...';
                showMessage('⏳ बफर हो रहा है...', 'info');
            });

            player.on('playing', function() {
                statusText.textContent = '✅ चल रहा है';
                hideMessage();
            });

            return player;
        }

        // ============================================================
        // 🎬 LOAD VIDEO - As per GitHub repo pattern
        // ============================================================
        function loadVideo() {
            const videoUrl = videoUrlInput.value.trim();
            if (!videoUrl) {
                showMessage('❌ कृपया एक वैध .m3u8 लिंक डालें!', 'error');
                return;
            }

            showMessage('⏳ वीडियो लोड हो रहा है...', 'info');
            statusText.textContent = '⏳ लोड हो रहा है...';

            // Save to localStorage (like repo's query param feature)
            localStorage.setItem('savedVideoUrl', videoUrl);

            if (!player) {
                player = initPlayer();
            }

            // Load the HLS stream
            try {
                player.src({
                    src: videoUrl,
                    type: 'application/x-mpegURL'
                });
                player.play().catch(() => {
                    showMessage('⚠️ ऑटोप्ले ब्लॉक, प्ले बटन दबाएँ', 'info');
                });
            } catch (error) {
                console.error('❌ Load error:', error);
                showMessage('❌ ' + error.message, 'error');
            }
        }

        // ============================================================
        // 🔄 RESET PLAYER
        // ============================================================
        function resetPlayer() {
            if (player) {
                player.pause();
                player.reset();
                player.src({ src: '', type: '' });
                statusText.textContent = 'तैयार';
                playerInfo.textContent = 'Video.js + hls.js';
                hideMessage();
                showMessage('🔄 प्लेयर रीसेट हो गया', 'info');
            }
        }

        // ============================================================
        // 📢 MESSAGE HELPER
        // ============================================================
        function showMessage(msg, type) {
            messageEl.textContent = msg;
            messageEl.className = 'message show ' + (type || 'info');
            if (type === 'success' || type === 'info') {
                clearTimeout(messageEl._hideTimer);
                messageEl._hideTimer = setTimeout(() => {
                    messageEl.classList.remove('show');
                }, 5000);
            }
        }

        function hideMessage() {
            messageEl.classList.remove('show');
            clearTimeout(messageEl._hideTimer);
        }

        // ============================================================
        // 👁️ VIEWER COUNTER (Simulated)
        // ============================================================
        function startViewerCounter() {
            let count = Math.floor(Math.random() * 40) + 10;
            viewerCountEl.textContent = count;
            setInterval(() => {
                let change = Math.floor(Math.random() * 7) - 3;
                let newCount = parseInt(viewerCountEl.textContent) + change;
                if (newCount < 3) newCount = 3 + Math.floor(Math.random() * 10);
                if (newCount > 150) newCount = 120 + Math.floor(Math.random() * 30);
                viewerCountEl.textContent = newCount;
            }, 7000);
        }
        startViewerCounter();

        // ============================================================
        // ⌨️ ENTER KEY SUPPORT
        // ============================================================
        videoUrlInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadVideo();
            }
        });

        // ============================================================
        // 🚀 PAGE LOAD - Check for query params (GitHub repo feature)
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize player
            player = initPlayer();

            // Check URL query parameters (as in the GitHub repo)
            const urlParams = new URLSearchParams(window.location.search);
            const videoParam = urlParams.get('video');
            const subtitleParam = urlParams.get('subtitle');

            if (videoParam) {
                videoUrlInput.value = videoParam;
                loadVideo();
                if (subtitleParam) {
                    console.log('📝 Subtitle URL:', subtitleParam);
                    // Add subtitle track if needed
                    // player.addRemoteTextTrack({ src: subtitleParam, kind: 'subtitles' });
                }
            } else {
                // Check localStorage
                const savedUrl = localStorage.getItem('savedVideoUrl');
                if (savedUrl && savedUrl !== "null" && savedUrl !== "") {
                    videoUrlInput.value = savedUrl;
                    loadVideo();
                }
            }

            console.log('✅ HLS Video Player initialized!');
            console.log('📺 Repo: https://github.com/avinashkranjan/HLS_VideoPlayer');
            console.log('💡 Use ?video=URL&subtitle=URL in query params');
        });

        // ============================================================
        // 🔄 AUTO-RETRY - Stalled Recovery
        // ============================================================
        setInterval(function() {
            if (!player) return;
            try {
                const tech = player.tech({ IWillNotUseThisInPlugins: true });
                if (tech && tech.vhs) {
                    const vhs = tech.vhs;
                    if (vhs && vhs.buffer && vhs.buffer.length === 0 && !player.paused()) {
                        console.log('🔄 Buffer empty, reloading...');
                        const src = localStorage.getItem('savedVideoUrl') || videoUrlInput.value;
                        if (src) {
                            player.src({ src: src, type: 'application/x-mpegURL' });
                            player.play().catch(() => {});
                        }
                    }
                }
            } catch (e) {
                // Ignore errors
            }
        }, 5000);
    </script>

</body>
</html>
