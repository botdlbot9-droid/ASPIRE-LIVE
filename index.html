<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveStream Pro - HLS Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ================================================================
           CSS - PROFESSIONAL DARK THEME
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a12;
            --bg-secondary: #12121e;
            --bg-card: #1a1a2e;
            --bg-input: #0f0f23;
            --border-color: #2a2a4e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b8;
            --text-muted: #6a6a8a;
            --accent-gold: #f7971e;
            --accent-gold-light: #ffd200;
            --accent-green: #00ff88;
            --accent-red: #ff0044;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        /* ----- NAVBAR ----- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #0a0a12;
            font-weight: 800;
        }

        .brand-text {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-status {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 0, 68, 0.15);
            padding: 6px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255, 0, 68, 0.3);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-red);
            border-radius: 50%;
            animation: pulse-dot 1.2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.7); }
        }

        .live-text {
            color: var(--accent-red);
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ----- MAIN CARD ----- */
        .main-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 28px;
            box-shadow: var(--shadow);
        }

        /* ----- PLAYER WRAPPER ----- */
        .player-wrapper {
            position: relative;
            background: #000;
            border-radius: var(--radius-sm);
            overflow: hidden;
            aspect-ratio: 16 / 9;
            width: 100%;
            margin-bottom: 20px;
        }

        #videoPlayer {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }

        /* ----- CONTROLS BAR (Live Button Only) ----- */
        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .btn {
            padding: 12px 36px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .btn-live {
            background: linear-gradient(135deg, var(--accent-red), #cc0033);
            color: #fff;
            box-shadow: 0 4px 20px rgba(255, 0, 68, 0.4);
        }

        .btn-live:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255, 0, 68, 0.6);
        }

        .btn-live:active {
            transform: scale(0.95);
        }

        .btn-live .pulse-ring {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            animation: pulse-ring 1.5s infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        .btn-refresh {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .btn-refresh:hover {
            border-color: var(--accent-gold);
            color: var(--text-primary);
        }

        /* ----- STATUS BAR ----- */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .status-item .label {
            color: var(--text-secondary);
        }

        .status-item .value {
            font-weight: 600;
            color: var(--accent-green);
        }

        .status-item .value.error {
            color: var(--accent-red);
        }

        .status-dot-green {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 1.5s infinite;
        }

        /* ----- MESSAGE ----- */
        .message {
            font-size: 14px;
            padding: 10px 16px;
            border-radius: 8px;
            display: none;
            margin-bottom: 12px;
        }

        .message.show {
            display: block;
        }

        .message.error {
            color: #ff6b6b;
            background: rgba(255, 0, 0, 0.08);
            border-left: 3px solid #ff6b6b;
        }

        .message.success {
            color: var(--accent-green);
            background: rgba(0, 255, 136, 0.08);
            border-left: 3px solid var(--accent-green);
        }

        .message.info {
            color: var(--accent-gold);
            background: rgba(247, 151, 30, 0.08);
            border-left: 3px solid var(--accent-gold);
        }

        /* ----- FOOTER ----- */
        .footer {
            margin-top: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 16px 0;
            border-top: 1px solid var(--border-color);
        }

        .footer .highlight {
            color: var(--accent-gold);
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        .footer a:hover {
            color: var(--accent-gold);
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 768px) {
            body { padding: 12px; }
            .main-card { padding: 16px; }
            .navbar { padding: 12px 16px; }
            .brand-text { font-size: 16px; }
            .status-bar { flex-direction: column; align-items: flex-start; }
            .btn { justify-content: center; width: 100%; }
        }

        @media (max-width: 480px) {
            .brand-text { font-size: 14px; }
            .nav-status .live-text { font-size: 10px; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== NAVBAR ===== -->
        <header class="navbar">
            <a href="#" class="brand">
                <span class="brand-icon"><i class="fas fa-play"></i></span>
                <span class="brand-text">LiveStream Pro</span>
            </a>
            <div class="nav-status">
                <span class="live-indicator">
                    <span class="live-dot"></span>
                    <span class="live-text">लाइव</span>
                </span>
                <span style="color: var(--text-muted); font-size: 13px;">
                    <i class="fas fa-users" style="margin-right: 4px;"></i>
                    <span id="viewerCountNav">0</span>
                </span>
            </div>
        </header>

        <!-- ===== MAIN CARD ===== -->
        <main class="main-card">

            <!-- ===== VIDEO PLAYER ===== -->
            <div class="player-wrapper">
                <video id="videoPlayer" controls playsinline autoplay preload="auto"></video>
            </div>

            <!-- ===== CONTROLS BAR (Live Button Only) ===== -->
            <div class="controls-bar">
                <button class="btn btn-live" onclick="loadLiveStream()">
                    <span class="pulse-ring"></span>
                    लाइव देखें
                </button>
                <button class="btn btn-refresh" onclick="refreshStream()">
                    <i class="fas fa-sync-alt"></i> रिफ्रेश
                </button>
            </div>

            <!-- ===== STATUS BAR ===== -->
            <div class="status-bar">
                <div class="status-item">
                    <span class="status-dot-green"></span>
                    <span class="label">स्थिति:</span>
                    <span class="value" id="statusText">तैयार</span>
                </div>
                <div class="status-item">
                    <span class="label"><i class="fas fa-eye"></i> दर्शक:</span>
                    <span class="value" id="viewerCount">0</span>
                </div>
                <div class="status-item">
                    <span class="label"><i class="fas fa-microchip"></i> प्लेयर:</span>
                    <span class="value" id="playerInfo">hls.js</span>
                </div>
                <div class="status-item">
                    <span class="label"><i class="fas fa-signal"></i> क्वालिटी:</span>
                    <span class="value" id="qualityInfo">-</span>
                </div>
            </div>

            <!-- ===== MESSAGE ===== -->
            <div id="message" class="message"></div>

            <!-- ===== PROXY STATUS ===== -->
            <div style="margin-top: 12px; font-size: 12px; color: var(--text-muted); text-align: center; border-top: 1px solid var(--border-color); padding-top: 12px;">
                🔗 Proxy: <span id="proxyInfo">Connecting...</span>
            </div>

        </main>

        <!-- ===== FOOTER ===== -->
        <footer class="footer">
            <p>
                ⚡ <span class="highlight">LiveStream Pro</span> —
                HLS Player · Livepush Style · No CORS Errors
                <br>
                <span style="font-size: 12px; color: var(--text-muted);">
                    <i class="fas fa-heart" style="color: var(--accent-red);"></i>
                    Made with ❤️
                </span>
            </p>
        </footer>

    </div>

    <!-- ============================================================ -->
    <!-- hls.js LIBRARY -->
    <!-- ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT - Live Button Only -->
    <!-- ============================================================ -->
    <script>
        /**
         * ================================================================
         *  🚀 LiveStream Pro - Live Button Only
         *  - Fixed .m3u8 link (changes manually in code)
         *  - "लाइव देखें" button loads the stream
         *  - "रिफ्रेश" button reloads the player
         * ================================================================
         */

        // ============================================================
        // 🔴 FIXED .m3u8 LINK (Change this when link expires)
        // ============================================================
        const VIDEO_URL = "https://vs.classplusapp.com/hls/6a7089aae86acfbc9dbb33f5/index.m3u8";

        // ============================================================
        // 🌐 PROXY SERVER URL (Your backend proxy)
        // ============================================================
        const PROXY_SERVER_URL = "https://your-proxy-server.onrender.com/proxy?url=";

        // ============================================================
        // 📦 DOM REFS
        // ============================================================
        const video = document.getElementById('videoPlayer');
        const statusText = document.getElementById('statusText');
        const viewerCountEl = document.getElementById('viewerCount');
        const viewerCountNav = document.getElementById('viewerCountNav');
        const playerInfo = document.getElementById('playerInfo');
        const qualityInfo = document.getElementById('qualityInfo');
        const messageEl = document.getElementById('message');
        const proxyInfo = document.getElementById('proxyInfo');

        // ============================================================
        // 🧠 STATE
        // ============================================================
        let hls = null;
        let retryCount = 0;
        const MAX_RETRIES = 999;
        let isLive = false;

        // ============================================================
        // 👁️ VIEWER COUNTER (Simulated)
        // ============================================================
        function startViewerCounter() {
            let count = Math.floor(Math.random() * 50) + 15;
            updateViewerCount(count);
            setInterval(() => {
                let change = Math.floor(Math.random() * 9) - 4;
                let newCount = parseInt(viewerCountEl.textContent) + change;
                if (newCount < 5) newCount = 5 + Math.floor(Math.random() * 15);
                if (newCount > 200) newCount = 150 + Math.floor(Math.random() * 50);
                updateViewerCount(newCount);
            }, 7000);
        }

        function updateViewerCount(count) {
            viewerCountEl.textContent = count;
            viewerCountNav.textContent = count;
        }
        startViewerCounter();

        // ============================================================
        // 📢 MESSAGE HELPER
        // ============================================================
        function showMessage(msg, type) {
            messageEl.textContent = msg;
            messageEl.className = 'message show ' + (type || 'info');
            if (type === 'success' || type === 'info') {
                clearTimeout(messageEl._hideTimer);
                messageEl._hideTimer = setTimeout(() => {
                    messageEl.classList.remove('show');
                }, 5000);
            }
        }

        function hideMessage() {
            messageEl.classList.remove('show');
            clearTimeout(messageEl._hideTimer);
        }

        // ============================================================
        // 🎬 LOAD LIVE STREAM — With Proxy
        // ============================================================
        function loadLiveStream() {
            hideMessage();
            statusText.textContent = "⏳ लोड हो रहा है...";
            statusText.className = 'value';
            playerInfo.textContent = "लोड हो रहा...";
            qualityInfo.textContent = "-";

            // Show proxy info
            proxyInfo.textContent = PROXY_SERVER_URL;

            if (hls) {
                hls.destroy();
                hls = null;
            }

            // ============================================================
            // 🔥 PROXY URL
            // ============================================================
            const proxyUrl = PROXY_SERVER_URL + encodeURIComponent(VIDEO_URL);
            console.log('🌐 Proxy URL:', proxyUrl);

            // ============================================================
            // SAFARI / iOS — Native HLS
            // ============================================================
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = proxyUrl;
                video.play().catch(() => {
                    showMessage("⚠️ ऑटोप्ले ब्लॉक, प्ले बटन दबाएँ", "info");
                });
                statusText.textContent = "✅ चल रहा है (Native)";
                playerInfo.textContent = "Safari Native + Proxy";
                showMessage("✅ लाइव स्ट्रीम शुरू!", "success");
                isLive = true;
                return;
            }

            // ============================================================
            // hls.js — Proxy + Custom Headers
            // ============================================================
            if (Hls.isSupported()) {
                try {
                    hls = new Hls({
                        enableWorker: true,
                        lowLatencyMode: true,
                        maxBufferLength: 60,
                        maxMaxBufferLength: 120,
                        maxBufferSize: 60 * 1000 * 1000,
                        startFragPrefetch: true,
                        liveDurationInfinity: true,
                        liveMaxLatencyDurationCount: 10,
                        liveSyncDurationCount: 10,
                        fragLoadingTimeOut: 60000,
                        manifestLoadingTimeOut: 60000,
                        levelLoadingTimeOut: 60000,
                        abrEwmaDefaultEstimate: 500000,
                        abrEwmaFastLive: 3.0,
                        abrEwmaSlowLive: 9.0,
                        testBandwidth: true,
                        xhrSetup: function(xhr, url) {
                            xhr.setRequestHeader('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36');
                            xhr.setRequestHeader('Accept', '*/*');
                            console.log('📡 Headers set for:', url);
                        }
                    });

                    hls.loadSource(proxyUrl);
                    hls.attachMedia(video);

                    // --- MANIFEST PARSED ---
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        console.log('✅ MANIFEST PARSED');
                        statusText.textContent = "✅ लाइव चल रहा है";
                        statusText.className = 'value';
                        playerInfo.textContent = "hls.js v" + Hls.version + ' 🌐Proxy';
                        showMessage("✅ लाइव स्ट्रीम शुरू!", "success");
                        isLive = true;
                        video.play().catch(() => {
                            showMessage("⚠️ ऑटोप्ले ब्लॉक, प्ले बटन दबाएँ", "info");
                        });
                    });

                    // --- FRAGMENT LOADED ---
                    hls.on(Hls.Events.FRAG_LOADED, function() {
                        statusText.textContent = "✅ लाइव चल रहा है";
                        statusText.className = 'value';
                        hideMessage();
                    });

                    // --- BUFFER STALLED ---
                    hls.on(Hls.Events.BUFFER_STALLED, function() {
                        console.log('🔄 BUFFER STALLED, recovering...');
                        statusText.textContent = "🔄 बफर...";
                        statusText.className = 'value';
                        showMessage("🔄 बफर रिफ्रेश...", "info");
                        setTimeout(() => {
                            if (hls) hls.startLoad();
                        }, 1000);
                    });

                    // --- LEVEL LOADED (Quality Info) ---
                    hls.on(Hls.Events.LEVEL_LOADED, function(event, data) {
                        if (data && data.details) {
                            const level = data.details;
                            const height = level.height || '?';
                            const bitrate = level.averageBitrate ? (level.averageBitrate / 1000).toFixed(0) : '?';
                            qualityInfo.textContent = `${height}p @ ${bitrate}kbps`;
                        }
                    });

                    // --- ERROR HANDLING ---
                    hls.on(Hls.Events.ERROR, function(event, data) {
                        console.log('⚠️ ERROR:', data.type, data.details);

                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    console.log('🔄 NETWORK ERROR, recovering...');
                                    statusText.textContent = "🔄 कनेक्शन...";
                                    showMessage("🔄 कनेक्शन पुनः स्थापित...", "info");
                                    setTimeout(() => {
                                        if (hls) hls.startLoad();
                                    }, 1500);
                                    break;

                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    console.log('🔄 MEDIA ERROR, recovering...');
                                    statusText.textContent = "🔄 मीडिया...";
                                    showMessage("🔄 मीडिया पुनः लोड...", "info");
                                    setTimeout(() => {
                                        if (hls) hls.recoverMediaError();
                                    }, 1500);
                                    break;

                                default:
                                    if (retryCount < MAX_RETRIES) {
                                        retryCount++;
                                        console.log(`🔄 Retry ${retryCount}/${MAX_RETRIES}...`);
                                        statusText.textContent = `🔄 प्रयास ${retryCount}...`;
                                        showMessage(`🔄 पुनः प्रयास ${retryCount}...`, "info");
                                        setTimeout(() => {
                                            loadLiveStream();
                                        }, 2000);
                                    } else {
                                        showMessage("❌ स्ट्रीम नहीं चल रही। लिंक एक्सपायर हो गया होगा।", "error");
                                        statusText.textContent = "❌ एरर";
                                        statusText.className = 'value error';
                                        playerInfo.textContent = "Error";
                                        isLive = false;
                                    }
                                    break;
                            }
                        } else {
                            if (data.details === 'fragLoadError' || data.details === 'fragParsingError') {
                                console.log('🔄 Fragment error, retrying...');
                                setTimeout(() => {
                                    if (hls) hls.startLoad();
                                }, 1000);
                            }
                        }
                    });

                } catch (error) {
                    console.error('❌ hls.js Error:', error);
                    showMessage("❌ प्लेयर एरर: " + error.message, "error");
                    statusText.textContent = "❌ एरर";
                    statusText.className = 'value error';
                    isLive = false;
                }

            } else {
                showMessage("❌ आपका ब्राउज़र HLS सपोर्ट नहीं करता।", "error");
                statusText.textContent = "❌ Unsupported";
                statusText.className = 'value error';
                isLive = false;
            }
        }

        // ============================================================
        // 🔄 REFRESH STREAM
        // ============================================================
        function refreshStream() {
            if (isLive) {
                console.log('🔄 Refreshing live stream...');
                showMessage("🔄 स्ट्रीम रिफ्रेश हो रहा है...", "info");
                retryCount = 0;
                loadLiveStream();
            } else {
                showMessage("⚠️ पहले 'लाइव देखें' दबाएँ!", "info");
            }
        }

        // ============================================================
        // 🚀 PAGE LOAD — Auto Start Live Stream
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // Show proxy info
            proxyInfo.textContent = PROXY_SERVER_URL;

            // Auto start live stream
            loadLiveStream();

            if (typeof Hls !== 'undefined' && Hls.version) {
                console.log('📦 hls.js v' + Hls.version);
            }

            console.log('✅ LiveStream Pro initialized!');
            console.log('📺 Live URL:', VIDEO_URL);
            console.log('🌐 Proxy Server:', PROXY_SERVER_URL);
            console.log('💡 Click "लाइव देखें" to start/restart stream');
        });

        // ============================================================
        // 🔄 AUTO-RETRY — Video Stall Recovery
        // ============================================================
        setInterval(function() {
            if (!video) return;

            if (video.paused && video.currentTime > 0 && !video.ended && video.readyState < 2 && isLive) {
                console.log('🔄 Video stalled, reloading...');
                statusText.textContent = "🔄 रिलोड...";
                showMessage("🔄 वीडियो पुनः लोड...", "info");
                loadLiveStream();
            }

            if (video.buffered.length > 0 && !video.paused && isLive) {
                const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                const currentTime = video.currentTime;
                if (bufferedEnd - currentTime < 2 && video.readyState < 3) {
                    console.log('🔄 Buffer low, refreshing...');
                    statusText.textContent = "🔄 बफर...";
                    loadLiveStream();
                }
            }
        }, 5000);
    </script>

</body>
