<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लाइव स्ट्रीम</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid #2a2a4e;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .live-badge {
            background: #ff0000;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            animation: blink 1.2s infinite;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .live-badge::before {
            content: "●";
            font-size: 18px;
            animation: pulse 1s infinite;
        }
        @keyframes blink {
            0%,100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        @keyframes pulse {
            0%,100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            width: 100%;
        }
        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            padding: 12px 18px;
            background: #12122a;
            border-radius: 12px;
            border: 1px solid #2a2a4e;
            flex-wrap: wrap;
            gap: 10px;
        }
        .viewer-count {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
        }
        .viewer-count .number {
            font-weight: 800;
            font-size: 22px;
            background: linear-gradient(135deg, #00c6fb, #005bea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        .status-text {
            color: #00ff88;
            font-weight: 600;
            font-size: 15px;
        }
        .input-section {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .input-section input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid #2a2a4e;
            background: #0f0f23;
            color: #fff;
            font-size: 15px;
            min-width: 200px;
            outline: none;
        }
        .input-section input:focus {
            border-color: #f7971e;
        }
        .input-section button {
            padding: 12px 28px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #0a0a0a;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .input-section button:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 30px rgba(247,151,30,0.4);
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #555;
            font-size: 13px;
            border-top: 1px solid #1a1a3e;
            padding-top: 18px;
        }
        .error-msg {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 8px;
            padding: 10px 16px;
            background: rgba(255,0,0,0.1);
            border-radius: 10px;
            border-left: 3px solid #ff6b6b;
            display: none;
        }
        .error-msg.show {
            display: block;
        }
        .success-msg {
            color: #00ff88;
            font-size: 14px;
            margin-top: 8px;
            padding: 10px 16px;
            background: rgba(0,255,136,0.1);
            border-radius: 10px;
            border-left: 3px solid #00ff88;
            display: none;
        }
        .success-msg.show {
            display: block;
        }
        @media (max-width: 600px) {
            .container { padding: 15px; }
            .header h1 { font-size: 18px; }
            .status-bar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>📺 लाइव स्ट्रीम</h1>
            <div class="live-badge">लाइव</div>
        </div>

        <div class="video-wrapper">
            <!-- ⭐ ClassPlus Official Player Embed - Isme CORS Error Nahi Aata -->
            <iframe 
                id="liveFrame"
                src="https://vs.classplusapp.com/hls/6a7089aae86acfbc9dbb33f5/index.m3u8"
                allow="autoplay; encrypted-media; fullscreen"
                allowfullscreen
            ></iframe>
        </div>

        <div class="status-bar">
            <div class="viewer-count">
                <span class="status-dot"></span>
                <span class="status-text">लाइव चल रहा है</span>
            </div>
            <div class="viewer-count">
                <span class="label">👁️ देख रहे हैं:</span>
                <span class="number" id="viewerCount">0</span>
            </div>
        </div>

        <!-- 🔧 Manual Link Input (Jab Link Expire Ho) -->
        <div class="input-section">
            <input type="text" id="videoUrlInput" placeholder="यहाँ .m3u8 लिंक पेस्ट करें..." />
            <button onclick="loadManualLink()">🎬 लोड करें</button>
        </div>

        <div id="successMsg" class="success-msg">✅ वीडियो लोड हो गया!</div>
        <div id="errorMsg" class="error-msg">❌ यह लिंक iframe में नहीं चल सकता। ClassPlus के Official Player का उपयोग करें।</div>
        <div class="footer">⚡ Render पर होस्ट किया गया | ClassPlus Official Player</div>
    </div>

    <script>
        // ============================================================
        // 🔴 DEFAULT LINK (अपना REAL .m3u8 लिंक डालें)
        // ============================================================
        const DEFAULT_VIDEO_URL = "https://vs.classplusapp.com/hls/6a7089aae86acfbc9dbb33f5/index.m3u8";

        const viewerCountEl = document.getElementById('viewerCount');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const inputField = document.getElementById('videoUrlInput');
        const liveFrame = document.getElementById('liveFrame');

        // ============================================================
        // 👁️ Viewer Count
        // ============================================================
        function startViewerCounter() {
            let count = Math.floor(Math.random() * 40) + 12;
            viewerCountEl.textContent = count;
            setInterval(() => {
                let change = Math.floor(Math.random() * 7) - 3;
                let newCount = parseInt(viewerCountEl.textContent) + change;
                if (newCount < 5) newCount = 5 + Math.floor(Math.random() * 10);
                if (newCount > 150) newCount = 120 + Math.floor(Math.random() * 30);
                viewerCountEl.textContent = newCount;
            }, 7000);
        }
        startViewerCounter();

        // ============================================================
        // 🔧 Manual Link Load - iframe में
        // ============================================================
        function loadManualLink() {
            const url = inputField.value.trim();
            if (!url) {
                errorMsg.textContent = "❌ कृपया पहले लिंक डालें!";
                errorMsg.classList.add('show');
                successMsg.classList.remove('show');
                return;
            }

            // ✅ ClassPlus URL को iframe में डालें
            if (url.includes('classplusapp.com')) {
                liveFrame.src = url;
                successMsg.textContent = "✅ वीडियो लोड हो गया!";
                successMsg.classList.add('show');
                errorMsg.classList.remove('show');
                localStorage.setItem('savedLink', url);
            } else {
                errorMsg.textContent = "❌ ClassPlus के अलावा अन्य लिंक iframe में काम नहीं करते।";
                errorMsg.classList.add('show');
                successMsg.classList.remove('show');
            }
        }

        // Enter Press
        inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadManualLink();
            }
        });

        // ============================================================
        // 🚀 Page Load
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const savedLink = localStorage.getItem('savedLink');
            let linkToLoad = DEFAULT_VIDEO_URL;

            if (savedLink && savedLink !== "null" && savedLink !== "") {
                linkToLoad = savedLink;
                inputField.value = savedLink;
            } else {
                inputField.value = DEFAULT_VIDEO_URL;
            }

            liveFrame.src = linkToLoad;
            successMsg.textContent = "✅ वीडियो लोड हो गया!";
            successMsg.classList.add('show');
        });

        console.log('✅ Live Stream Website Ready!');
        console.log('📺 Link:', DEFAULT_VIDEO_URL);
        console.log('💡 ClassPlus Official Player Use Ho Raha Hai, CORS Error Nahi Aayega!');
    </script>

</body>
</html>
