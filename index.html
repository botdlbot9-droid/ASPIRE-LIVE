<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream - Private</title>
    <link href="https://unpkg.com/video.js@8/dist/video-js.min.css" rel="stylesheet">
    <script src="https://unpkg.com/video.js@8/dist/video.min.js"></script>
    <script src="https://unpkg.com/@videojs/http-streaming@3/dist/videojs-http-streaming.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* ================================================================
           CSS - Full Dark Theme (Referer Safe)
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #2a2a4e;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .live-badge {
            background: #ff0044;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            animation: blink 1.2s infinite;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-badge::before {
            content: "●";
            font-size: 16px;
            animation: pulse 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .player-wrapper {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            width: 100%;
            margin-bottom: 20px;
        }

        #my-video {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 🔥 Controls - Only Live Button */
        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
            background: #12121e;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid #2a2a4e;
            margin-bottom: 16px;
        }

        .btn {
            padding: 12px 36px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Segoe UI', sans-serif;
        }

        .btn-live {
            background: linear-gradient(135deg, #ff0044, #cc0033);
            color: #fff;
            box-shadow: 0 4px 20px rgba(255, 0, 68, 0.4);
        }

        .btn-live:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255, 0, 68, 0.6);
        }

        .btn-live .pulse-ring {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            animation: pulse-ring 1.5s infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        .btn-refresh {
            background: #0f0f23;
            border: 1px solid #2a2a4e;
            color: #a0a0b8;
            padding: 12px 20px;
        }

        .btn-refresh:hover {
            border-color: #f7971e;
            color: #fff;
        }

        /* 🔥 Status Bar - No Viewer Count */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 16px;
            background: #12121e;
            border-radius: 10px;
            border: 1px solid #2a2a4e;
            margin-bottom: 16px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .status-item .label {
            color: #a0a0b8;
        }

        .status-item .value {
            font-weight: 600;
            color: #00ff88;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        .message {
            font-size: 14px;
            padding: 10px 16px;
            border-radius: 8px;
            display: none;
            margin-bottom: 12px;
        }

        .message.show {
            display: block;
        }

        .message.error {
            color: #ff6b6b;
            background: rgba(255, 0, 0, 0.08);
            border-left: 3px solid #ff6b6b;
        }

        .message.success {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.08);
            border-left: 3px solid #00ff88;
        }

        .message.info {
            color: #f7971e;
            background: rgba(247, 151, 30, 0.08);
            border-left: 3px solid #f7971e;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #6a6a8a;
            font-size: 13px;
            border-top: 1px solid #1a1a3e;
            padding-top: 18px;
        }

        .footer .highlight {
            color: #f7971e;
        }

        @media (max-width: 768px) {
            .container { padding: 16px; }
            .controls-bar { flex-direction: column; }
            .btn { justify-content: center; width: 100%; }
            .status-bar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📺 Live Stream</h1>
            <div class="live-badge">लाइव</div>
        </div>

        <!-- Video Player -->
        <div class="player-wrapper">
            <!-- 🔥 referrerpolicy="no-referrer" - Referer Header नहीं भेजेगा -->
            <video id="my-video" class="video-js vjs-big-play-centered vjs-16-9" 
                   controls preload="auto" playsinline
                   referrerpolicy="no-referrer">
                <p class="vjs-no-js">Please enable JavaScript</p>
            </video>
        </div>

        <!-- Controls -->
        <div class="controls-bar">
            <button class="btn btn-live" onclick="loadLiveStream()">
                <span class="pulse-ring"></span> लाइव देखें
            </button>
        </div>

        <!-- Status Bar - No Viewer Count -->
        <div class="status-bar">
            <div class="status-item">
                <span class="status-dot"></span>
                <span class="label">स्थिति:</span>
                <span class="value" id="statusText">तैयार</span>
            </div>
            <div class="status-item">
                <span class="label"><i class="fas fa-microchip"></i> प्लेयर:</span>
                <span class="value" id="playerInfo">Video.js</span>
            </div>
        </div>

        <!-- Message -->
        <div id="message" class="message"></div>

        <!-- Footer -->
        <footer class="footer">
            <p>⚡ <span class="highlight">Private Stream</span> </p>
        </footer>
    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT - Full Safe Code -->
    <!-- ============================================================ -->
    <script>
        /**
         * ================================================================
         *  🚀 PRIVATE LIVE STREAM - No Viewer Count, No Referer
         *  - referrerpolicy="no-referrer" in video tag
         *  - No viewer count display
         *  - Auto start live stream
         * ================================================================
         */

        // ============================================================
        // 🔴 FIXED VIDEO URL (Change this to your .m3u8 link)
        // ============================================================
        const VIDEO_URL = "https://vs.classplusapp.com/hls/6a7089aae86acfbc9dbb33f5/index.m3u8";

        // ============================================================
        // 📦 DOM REFS
        // ============================================================
        const statusText = document.getElementById('statusText');
        const playerInfo = document.getElementById('playerInfo');
        const messageEl = document.getElementById('message');

        // ============================================================
        // 🎬 VIDEO.JS PLAYER (Referer Safe)
        // ============================================================
        let player = null;

        function initPlayer() {
            if (player) {
                player.dispose();
                player = null;
            }

            player = videojs('my-video', {
                controls: true,
                autoplay: false,
                preload: 'auto',
                fluid: true,
                html5: {
                    hls: {
                        enableWorker: true,
                        lowLatencyMode: true,
                        maxBufferLength: 30,
                        // 🔥 Referer हटाने के लिए xhrSetup
                        xhrSetup: function(xhr, url) {
                            // Referer को खाली करें
                            xhr.setRequestHeader('Referer', '');
                            // या पूरी तरह हटाएँ
                            try {
                                delete xhr._headers['Referer'];
                            } catch(e) {}
                            console.log('🔒 Referer header removed for:', url);
                        }
                    }
                }
            });

            // --- Player Events ---
            player.ready(function() {
                console.log('✅ Player Ready (Referer Safe)');
                statusText.textContent = '✅ तैयार';
                playerInfo.textContent = 'Live Player';
                showMessage('✅ प्लेयर तैयार है', 'success');
            });

            player.on('error', function() {
                const error = player.error();
                console.error('❌ Player Error:', error);
                showMessage(`❌ ${error.message || 'Unknown error'}`, 'error');
                statusText.textContent = '❌ एरर';
            });

            player.on('waiting', function() {
                statusText.textContent = '⏳ बफर...';
                showMessage('⏳ बफर हो रहा है...', 'info');
            });

            player.on('playing', function() {
                statusText.textContent = '✅ चल रहा है';
                hideMessage();
            });

            return player;
        }

        // ============================================================
        // 🎬 LOAD LIVE STREAM
        // ============================================================
        function loadLiveStream() {
            showMessage('⏳ लाइव स्ट्रीम लोड हो रहा है...', 'info');
            statusText.textContent = '⏳ लोड हो रहा है...';

            if (!player) {
                player = initPlayer();
            }

            try {
                player.src({
                    src: VIDEO_URL,
                    type: 'application/x-mpegURL'
                });
                player.play().catch(() => {
                    showMessage('⚠️ ऑटोप्ले ब्लॉक, प्ले बटन दबाएँ', 'info');
                });
                showMessage('✅ लाइव स्ट्रीम शुरू!', 'success');
            } catch (error) {
                console.error('❌ Load error:', error);
                showMessage('❌ ' + error.message, 'error');
            }
        }

        // ============================================================
        // 🔄 RESET PLAYER
        // ============================================================
        function resetPlayer() {
            if (player) {
                player.pause();
                player.reset();
                player.src({ src: '', type: '' });
                statusText.textContent = 'तैयार';
                playerInfo.textContent = 'Live Player';
                hideMessage();
                showMessage('🔄 प्लेयर रीसेट हो गया', 'info');
            }
        }

        // ============================================================
        // 📢 MESSAGE HELPER
        // ============================================================
        function showMessage(msg, type) {
            messageEl.textContent = msg;
            messageEl.className = 'message show ' + (type || 'info');
            if (type === 'success' || type === 'info') {
                clearTimeout(messageEl._hideTimer);
                messageEl._hideTimer = setTimeout(() => {
                    messageEl.classList.remove('show');
                }, 5000);
            }
        }

        function hideMessage() {
            messageEl.classList.remove('show');
            clearTimeout(messageEl._hideTimer);
        }

        // ============================================================
        // 🚀 PAGE LOAD - Auto Start
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize player
            player = initPlayer();

            // Auto start live stream
            setTimeout(() => {
                loadLiveStream();
            }, 500);

            console.log('✅ Private Live Stream initialized!');
            console.log('📺 Video URL:', VIDEO_URL);
            console.log('🔒 Referer header: REMOVED');
            console.log('👁️ Viewer Count: HIDDEN');
        });

        // ============================================================
        // 🔄 AUTO-RETRY - Stalled Recovery
        // ============================================================
        setInterval(function() {
            if (!player) return;
            try {
                const tech = player.tech({ IWillNotUseThisInPlugins: true });
                if (tech && tech.vhs) {
                    const vhs = tech.vhs;
                    if (vhs && vhs.buffer && vhs.buffer.length === 0 && !player.paused()) {
                        console.log('🔄 Buffer empty, reloading...');
                        player.src({ src: VIDEO_URL, type: 'application/x-mpegURL' });
                        player.play().catch(() => {});
                    }
                }
            } catch (e) {
                // Ignore
            }
        }, 5000);
    </script>

</body>
</html>
