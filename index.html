<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>लाइव स्ट्रीम</title>
  
  <!-- LivePlayer CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@zeronx/liveplayer@latest/dist/liveplayer.min.css" />
  
  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>📺 लाइव स्ट्रीम</h1>
      <div class="live-badge">लाइव</div>
    </div>

    <!-- LivePlayer कंटेनर -->
    <div class="video-wrapper">
      <div id="player-container"></div>
    </div>

    <div class="status-bar">
      <div class="viewer-count">
        <span class="status-dot"></span>
        <span class="status-text">लाइव चल रहा है</span>
      </div>
      <div class="viewer-count">
        <span class="label">👁️ देख रहे हैं:</span>
        <span class="number" id="viewerCount">0</span>
      </div>
    </div>

    <div id="errorMsg" class="error-msg">❌ वीडियो लोड नहीं हुआ।</div>
    <div class="footer">⚡ Render पर होस्ट किया गया | LivePlayer</div>
  </div>

  <!-- हम hls.js का उपयोग करेंगे (बिना LivePlayer के) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <!-- JS -->
  <script src="script.js"></script>
</body>
</html>
