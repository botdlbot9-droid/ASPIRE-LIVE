<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Live Stream - Verification</title>
    <link href="https://unpkg.com/video.js@8/dist/video-js.min.css" rel="stylesheet">
    <script src="https://unpkg.com/video.js@8/dist/video.min.js"></script>
    <script src="https://unpkg.com/@videojs/http-streaming@3/dist/videojs-http-streaming.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* ================================================================
           CSS - Full Dark Theme (Verification + Player)
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #2a2a4e;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .hidden {
            display: none !important;
        }

        /* ===== VERIFICATION PAGE ===== */
        #verificationPage {
            max-width: 500px;
            margin: 40px auto;
            text-align: center;
        }

        .verify-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .verify-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .verify-subtitle {
            color: #a0a0b8;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .verify-input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid #2a2a4e;
            background: #0f0f23;
            color: #fff;
            font-size: 20px;
            text-align: center;
            letter-spacing: 6px;
            font-weight: 700;
            outline: none;
            transition: 0.3s;
            font-family: 'Segoe UI', sans-serif;
        }

        .verify-input:focus {
            border-color: #f7971e;
            box-shadow: 0 0 0 3px rgba(247, 151, 30, 0.15);
        }

        .verify-input::placeholder {
            letter-spacing: 0;
            font-weight: 400;
            color: #6a6a8a;
            font-size: 14px;
        }

        .verify-btn {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #0a0a12;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Segoe UI', sans-serif;
        }

        .verify-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(247, 151, 30, 0.35);
        }

        .verify-error {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 12px;
            min-height: 20px;
        }

        .verify-success {
            color: #00ff88;
            font-size: 14px;
            margin-top: 12px;
            min-height: 20px;
        }

        /* ================================================================
           🔥 KEY LIST - Click to Copy
           ================================================================ */
        .key-list-container {
            margin-top: 25px;
            padding: 20px;
            background: #12121e;
            border-radius: 12px;
            border: 1px solid #2a2a4e;
        }

        .key-list-title {
            font-size: 14px;
            font-weight: 600;
            color: #a0a0b8;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 1px;
        }

        .key-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }

        .key-item {
            background: #0f0f23;
            border: 1px solid #2a2a4e;
            border-radius: 8px;
            padding: 10px 8px;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #f7971e;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .key-item:hover {
            background: #1a1a3e;
            border-color: #f7971e;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(247, 151, 30, 0.15);
        }

        .key-item:active {
            transform: scale(0.95);
        }

        .key-item.copied {
            background: #00ff88;
            color: #0a0a12;
            border-color: #00ff88;
        }

        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #00ff88;
            color: #0a0a12;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 10px 40px rgba(0, 255, 136, 0.3);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 9999;
            pointer-events: none;
        }

        .toast-message.show {
            opacity: 1;
        }

        /* ===== PLAYER PAGE ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .class-name {
            background: rgba(247, 151, 30, 0.15);
            border: 1px solid rgba(247, 151, 30, 0.3);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            color: #f7971e;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .class-name i {
            font-size: 14px;
        }

        .live-badge {
            background: #ff0044;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            animation: blink 1.2s infinite;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-badge::before {
            content: "●";
            font-size: 16px;
            animation: pulse 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .player-wrapper {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            width: 100%;
            margin-bottom: 20px;
        }

        #my-video {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
            background: #12121e;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid #2a2a4e;
            margin-bottom: 16px;
        }

        .btn {
            padding: 12px 36px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Segoe UI', sans-serif;
        }

        .btn-live {
            background: linear-gradient(135deg, #ff0044, #cc0033);
            color: #fff;
            box-shadow: 0 4px 20px rgba(255, 0, 68, 0.4);
        }

        .btn-live:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255, 0, 68, 0.6);
        }

        .btn-live .pulse-ring {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            animation: pulse-ring 1.5s infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        /* ================================================================
           🔥 DURATION DISPLAY - Lecture Time (HH:MM:SS format)
           ================================================================ */
        .duration-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: #12121e;
            border-radius: 10px;
            border: 1px solid #2a2a4e;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .duration-bar .label {
            color: #a0a0b8;
        }

        .duration-bar .value {
            font-weight: 700;
            color: #f7971e;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            letter-spacing: 2px;
            min-width: 100px;
            text-align: center;
        }

        .duration-bar .live-icon {
            color: #ff0044;
            animation: pulse 1.5s infinite;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 16px;
            background: #12121e;
            border-radius: 10px;
            border: 1px solid #2a2a4e;
            margin-bottom: 16px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .status-item .label {
            color: #a0a0b8;
        }

        .status-item .value {
            font-weight: 600;
            color: #00ff88;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        .message {
            font-size: 14px;
            padding: 10px 16px;
            border-radius: 8px;
            display: none;
            margin-bottom: 12px;
        }

        .message.show {
            display: block;
        }

        .message.error {
            color: #ff6b6b;
            background: rgba(255, 0, 0, 0.08);
            border-left: 3px solid #ff6b6b;
        }

        .message.success {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.08);
            border-left: 3px solid #00ff88;
        }

        .message.info {
            color: #f7971e;
            background: rgba(247, 151, 30, 0.08);
            border-left: 3px solid #f7971e;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #6a6a8a;
            font-size: 13px;
            border-top: 1px solid #1a1a3e;
            padding-top: 18px;
        }

        .footer .highlight {
            color: #f7971e;
        }

        @media (max-width: 768px) {
            .container { padding: 16px; }
            .controls-bar { flex-direction: column; }
            .btn { justify-content: center; width: 100%; }
            .status-bar { flex-direction: column; align-items: flex-start; }
            .header { flex-direction: column; align-items: flex-start; }
            .class-name { font-size: 12px; padding: 4px 12px; }
            .key-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            .key-item { font-size: 14px; padding: 8px 6px; }
            .duration-bar { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <div class="container" id="appContainer">

        <!-- ========================================================== -->
        <!-- 🔐 VERIFICATION PAGE -->
        <!-- ========================================================== -->
        <div id="verificationPage">
            <div class="verify-icon">🔑</div>
            <div class="verify-title">Access Code Required</div>
            <div class="verify-subtitle">Enter your one-time access key to watch the live stream</div>
            
            <form id="verifyForm" onsubmit="return false;">
                <input type="text" class="verify-input" id="keyInput" placeholder="Enter 8-digit key" maxlength="8" autofocus>
                <button type="submit" class="verify-btn" id="verifyBtn">🔓 Unlock Stream</button>
            </form>
            
            <div id="verifyMessage" class="verify-error"></div>

            <div class="key-list-container">
                <div class="key-list-title">📋 Click any key to copy</div>
                <div class="key-grid" id="keyGrid"></div>
            </div>
        </div>

        <!-- ========================================================== -->
        <!-- 🎬 PLAYER PAGE (Hidden by default) -->
        <!-- ========================================================== -->
        <div id="playerPage" class="hidden">

            <div class="header">
                <div class="header-left">
                    <h1>📺 Live Stream</h1>
                    <span class="class-name" id="liveClassName">
                        <i class="fas fa-chalkboard-teacher"></i> 
                        <span id="classNameText">ClassPlus Live</span>
                    </span>
                </div>
                <div class="live-badge">लाइव</div>
            </div>

            <div class="player-wrapper">
                <video id="my-video" class="video-js vjs-big-play-centered vjs-16-9" 
                       controls preload="auto" playsinline
                       referrerpolicy="no-referrer">
                    <p class="vjs-no-js">Please enable JavaScript</p>
                </video>
            </div>

            <!-- 🔥 DURATION BAR - HH:MM:SS format -->
            <div class="duration-bar">
                <span class="live-icon">●</span>
                <span class="label">⏱️ Lecture Duration:</span>
                <span class="value" id="durationDisplay">00:00:00</span>
            </div>

            <div class="controls-bar">
                <button class="btn btn-live" onclick="loadLiveStream()">
                    <span class="pulse-ring"></span> लाइव देखें
                </button>
            </div>

            <div class="status-bar">
                <div class="status-item">
                    <span class="status-dot"></span>
                    <span class="label">स्थिति:</span>
                    <span class="value" id="statusText">तैयार</span>
                </div>
                <div class="status-item">
                    <span class="label"><i class="fas fa-microchip"></i> प्लेयर:</span>
                    <span class="value" id="playerInfo">Video.js</span>
                </div>
            </div>

            <div id="message" class="message"></div>

            <footer class="footer">
                <p>⚡ <span class="highlight">Secure Stream</span> — One-Time Access</p>
            </footer>
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- TOAST MESSAGE -->
    <!-- ============================================================ -->
    <div id="toastMessage" class="toast-message">✅ Copied!</div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT -->
    <!-- ============================================================ -->
    <script>
        /**
         * ================================================================
         *  🔐 SECURE LIVE STREAM - One-Time Verification Key
         *  - Click on any key to copy it
         *  - User must enter valid 8-digit key
         *  - Key can be used only once (stored in localStorage)
         *  - Shows lecture duration in HH:MM:SS format
         *  - ✅ Enter key works on the input field
         * ================================================================
         */

        // ============================================================
        // 🔑 CONFIGURATION
        // ============================================================

        const CLASS_NAME = "ClassPlus Live";
        const VIDEO_URL = "https://vs.classplusapp.com/hls/6a718806e15274f80f0ea83c/720p20.m3u8";

        // ⭐⭐⭐ 30 Random One-Time Keys ⭐⭐⭐
        const VALID_KEYS = [
            'K7H9R2M4', 'X8P5L3N6', 'Q2W9E7R1', 'T5Y4U8I2', 'F9G7H3J5',
            'B6V8C4X1', 'Z9M2N5P7', 'R4T8W3Q6', 'Y1U5I9O2', 'L3K8J6H4',
            'D7A4F2G9', 'M8P3N6C2', 'V5B9T1E7', 'S4W7R8K2', 'J3H6L9N1',
            'P8Q2M5T7', 'C6V9B4N2', 'F3R8K7W5', 'L9N2M6P4', 'G5T1E8S7',
            'B7R4M9K2', 'X8W5P3N1', 'Q2T6V9C4', 'H5J8F3L7', 'Z6M2N9P4',
            'R8W3Q7T5', 'Y4U9I2O7', 'L3K8J6H4', 'F9G7H3J5', 'P5N6M8C2'
        ];

        // ============================================================
        // 📦 DOM REFS
        // ============================================================
        const verificationPage = document.getElementById('verificationPage');
        const playerPage = document.getElementById('playerPage');
        const keyInput = document.getElementById('keyInput');
        const verifyMessage = document.getElementById('verifyMessage');
        const keyGrid = document.getElementById('keyGrid');
        const toast = document.getElementById('toastMessage');
        const verifyForm = document.getElementById('verifyForm');

        const statusText = document.getElementById('statusText');
        const playerInfo = document.getElementById('playerInfo');
        const messageEl = document.getElementById('message');
        const classNameText = document.getElementById('classNameText');
        const durationDisplay = document.getElementById('durationDisplay');

        // ============================================================
        // 🏷️ SET CLASS NAME
        // ============================================================
        classNameText.textContent = CLASS_NAME;

        // ============================================================
        // 🔑 RENDER KEYS WITH CLICK-TO-COPY
        // ============================================================
        function renderKeys() {
            keyGrid.innerHTML = '';
            VALID_KEYS.forEach(key => {
                const el = document.createElement('div');
                el.className = 'key-item';
                el.textContent = key;
                el.title = 'Click to copy';
                el.addEventListener('click', function() {
                    copyKey(key, el);
                });
                keyGrid.appendChild(el);
            });
        }

        // ============================================================
        // 📋 COPY KEY FUNCTION
        // ============================================================
        function copyKey(key, element) {
            navigator.clipboard.writeText(key).then(() => {
                element.classList.add('copied');
                setTimeout(() => {
                    element.classList.remove('copied');
                }, 800);
                showToast(`✅ Copied: ${key}`);
            }).catch(() => {
                const textArea = document.createElement('textarea');
                textArea.value = key;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                element.classList.add('copied');
                setTimeout(() => {
                    element.classList.remove('copied');
                }, 800);
                showToast(`✅ Copied: ${key}`);
            });
        }

        // ============================================================
        // 🔔 TOAST NOTIFICATION
        // ============================================================
        let toastTimer = null;

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // ============================================================
        // 🔐 VERIFICATION LOGIC
        // ============================================================

        function verifyKey() {
            const enteredKey = keyInput.value.trim();

            if (!enteredKey) {
                verifyMessage.textContent = '❌ Please enter an access key!';
                verifyMessage.className = 'verify-error';
                return;
            }

            if (enteredKey.length !== 8) {
                verifyMessage.textContent = '❌ Key must be exactly 8 characters!';
                verifyMessage.className = 'verify-error';
                return;
            }

            const usedKeys = JSON.parse(localStorage.getItem('usedKeys') || '[]');
            if (usedKeys.includes(enteredKey)) {
                verifyMessage.textContent = '❌ This key has already been used!';
                verifyMessage.className = 'verify-error';
                return;
            }

            if (VALID_KEYS.includes(enteredKey)) {
                usedKeys.push(enteredKey);
                localStorage.setItem('usedKeys', JSON.stringify(usedKeys));

                verifyMessage.textContent = '✅ Access granted! Loading stream...';
                verifyMessage.className = 'verify-success';

                setTimeout(() => {
                    verificationPage.classList.add('hidden');
                    playerPage.classList.remove('hidden');
                    initPlayer();
                    setTimeout(() => loadLiveStream(), 500);
                }, 800);

            } else {
                verifyMessage.textContent = '❌ Invalid access key! Please try again.';
                verifyMessage.className = 'verify-error';
                keyInput.value = '';
                keyInput.focus();
            }
        }

        // ============================================================
        // ⌨️ Enter Key Support
        // ============================================================
        verifyForm.addEventListener('submit', function(e) {
            e.preventDefault();
            verifyKey();
        });

        keyInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                verifyKey();
            }
        });

        // ============================================================
        // 🎬 VIDEO.JS PLAYER
        // ============================================================
        let player = null;

        function initPlayer() {
            if (player) {
                player.dispose();
                player = null;
            }

            player = videojs('my-video', {
                controls: true,
                autoplay: false,
                preload: 'auto',
                fluid: true,
                html5: {
                    hls: {
                        enableWorker: true,
                        lowLatencyMode: true,
                        maxBufferLength: 30,
                        xhrSetup: function(xhr, url) {
                            xhr.setRequestHeader('Referer', '');
                            try {
                                delete xhr._headers['Referer'];
                            } catch(e) {}
                            console.log('🔒 Referer removed for:', url);
                        }
                    }
                }
            });

            player.ready(function() {
                console.log('✅ Player Ready');
                statusText.textContent = '✅ तैयार';
                playerInfo.textContent = 'Video.js + hls.js';
                showMessage('✅ प्लेयर तैयार है', 'success');
            });

            player.on('error', function() {
                const error = player.error();
                console.error('❌ Player Error:', error);
                showMessage(`❌ ${error.message || 'Unknown error'}`, 'error');
                statusText.textContent = '❌ एरर';
            });

            player.on('waiting', function() {
                statusText.textContent = '⏳ बफर...';
                showMessage('⏳ बफर हो रहा है...', 'info');
            });

            player.on('playing', function() {
                statusText.textContent = '✅ चल रहा है';
                hideMessage();
            });

            // ============================================================
            // 🔥 DURATION UPDATE - HH:MM:SS format (60 min ke baad 01:06:10)
            // ============================================================
            player.on('timeupdate', function() {
                const currentTime = player.currentTime();
                if (currentTime && !isNaN(currentTime)) {
                    const hours = Math.floor(currentTime / 3600);
                    const minutes = Math.floor((currentTime % 3600) / 60);
                    const seconds = Math.floor(currentTime % 60);
                    
                    // Format: HH:MM:SS
                    durationDisplay.textContent = 
                        String(hours).padStart(2, '0') + ':' + 
                        String(minutes).padStart(2, '0') + ':' + 
                        String(seconds).padStart(2, '0');
                }
            });

            // Reset on end or load
            player.on('ended', function() {
                durationDisplay.textContent = '00:00:00';
            });

            player.on('loadstart', function() {
                durationDisplay.textContent = '00:00:00';
            });

            return player;
        }

        // ============================================================
        // 🎬 LOAD LIVE STREAM
        // ============================================================
        function loadLiveStream() {
            showMessage('⏳ लाइव स्ट्रीम लोड हो रहा है...', 'info');
            statusText.textContent = '⏳ लोड हो रहा है...';
            durationDisplay.textContent = '00:00:00';

            if (!player) {
                player = initPlayer();
            }

            try {
                player.src({
                    src: VIDEO_URL,
                    type: 'application/x-mpegURL'
                });
                player.play().catch(() => {
                    showMessage('⚠️ ऑटोप्ले ब्लॉक, प्ले बटन दबाएँ', 'info');
                });
                showMessage('✅ लाइव स्ट्रीम शुरू!', 'success');
            } catch (error) {
                console.error('❌ Load error:', error);
                showMessage('❌ ' + error.message, 'error');
            }
        }

        // ============================================================
        // 📢 MESSAGE HELPER
        // ============================================================
        function showMessage(msg, type) {
            messageEl.textContent = msg;
            messageEl.className = 'message show ' + (type || 'info');
            if (type === 'success' || type === 'info') {
                clearTimeout(messageEl._hideTimer);
                messageEl._hideTimer = setTimeout(() => {
                    messageEl.classList.remove('show');
                }, 5000);
            }
        }

        function hideMessage() {
            messageEl.classList.remove('show');
            clearTimeout(messageEl._hideTimer);
        }

        // ============================================================
        // 🚀 PAGE LOAD
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            renderKeys();
            console.log('✅ Secure Live Stream initialized!');
            console.log('📚 Class Name:', CLASS_NAME);
            console.log('🔑 Total Keys:', VALID_KEYS.length);
            console.log('📺 Video URL:', VIDEO_URL);
            console.log('🔒 Referer: REMOVED');
            console.log('💡 Click any key to copy');
            console.log('⏱️ Duration: HH:MM:SS format');
            console.log('⌨️ Press ENTER to verify key');
        });

        // ============================================================
        // 🔄 AUTO-RETRY - Stalled Recovery
        // ============================================================
        setInterval(function() {
            if (!player) return;
            try {
                const tech = player.tech({ IWillNotUseThisInPlugins: true });
                if (tech && tech.vhs) {
                    const vhs = tech.vhs;
                    if (vhs && vhs.buffer && vhs.buffer.length === 0 && !player.paused()) {
                        console.log('🔄 Buffer empty, reloading...');
                        player.src({ src: VIDEO_URL, type: 'application/x-mpegURL' });
                        player.play().catch(() => {});
                    }
                }
            } catch (e) {
                // Ignore
            }
        }, 5000);
    </script>

</body>
</html>
