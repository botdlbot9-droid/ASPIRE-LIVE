<!DOCTYPE html>
<html>
<head>
    <!-- आपका अन्य HTML कोड यहाँ -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <video id="video" controls></video>
    <div id="blankOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; color:white; font-size:2rem; display:flex; justify-content:center; align-items:center; z-index:999;">
        ⏸️ स्ट्रीम रुकी हुई है
    </div>

    <script>
        // ============================================================
        // 🔑 अपना Worker URL यहाँ डालें
        // ============================================================
        const WORKER_URL = "https://hls-d1-api.bbro75574-4c4.workers.dev";
        const VIDEO_URL = "https://vs.classplusapp.com/hls/6a718806e15274f80f0ea83c/720p20.m3u8";

        let player = null;

        // ============================================================
        // 🔄 स्टेटस चेक करें और UI अपडेट करें
        // ============================================================
        async function checkStatus() {
            try {
                const response = await fetch(`${WORKER_URL}/status`);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                const status = data.value || 'playing';

                const blankOverlay = document.getElementById('blankOverlay');
                if (status === 'paused' || status === 'blank') {
                    blankOverlay.style.display = 'flex';
                    if (player) player.pause();
                } else {
                    blankOverlay.style.display = 'none';
                    if (player && player.paused) {
                        player.play().catch(e => console.log('Autoplay error:', e));
                    }
                }
            } catch (error) {
                console.error('Error checking status:', error);
            }
        }

        // ============================================================
        // 🎬 प्लेयर इनिशियलाइज़ करें
        // ============================================================
        function initPlayer() {
            if (Hls.isSupported()) {
                player = new Hls();
                player.loadSource(VIDEO_URL);
                player.attachMedia(document.getElementById('video'));
                player.on(Hls.Events.MANIFEST_PARSED, function() {
                    player.play();
                });
                // हर 3 सेकंड में स्टेटस चेक करें
                setInterval(checkStatus, 3000);
                // पहली बार तुरंत चेक करें
                checkStatus();
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari के लिए फॉलबैक
                player = document.getElementById('video');
                player.src = VIDEO_URL;
                player.addEventListener('loadedmetadata', function() {
                    player.play();
                });
                setInterval(checkStatus, 3000);
                checkStatus();
            }
        }

        // ============================================================
        // 🚀 पेज लोड होने पर प्लेयर शुरू करें
        // ============================================================
        document.addEventListener('DOMContentLoaded', initPlayer);
    </script>
</body>
</html>
