<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Shaka Player - Live Stream</title>
    <style>
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #video-container {
            width: 90%;
            max-width: 1000px;
            background: #1a1a2e;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a2a4e;
        }
        #videoElement {
            width: 100%;
            height: auto;
            display: block;
            background: #000;
            aspect-ratio: 16/9;
        }
        #status {
            color: #00ff88;
            padding: 12px 18px;
            background: #12122a;
            text-align: center;
            font-size: 14px;
            border-top: 1px solid #2a2a4e;
            font-weight: 500;
        }
        #status.error {
            color: #ff6b6b;
        }
        #status.loading {
            color: #f7971e;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: #1a1a2e;
            border-bottom: 1px solid #2a2a4e;
        }
        .header h2 {
            color: #fff;
            font-size: 18px;
            margin: 0;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .live-badge {
            background: #ff0000;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            animation: blink 1.2s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>

<div id="video-container">
    <div class="header">
        <h2>📺 लाइव स्ट्रीम</h2>
        <span class="live-badge">लाइव</span>
    </div>
    <video id="videoElement" controls autoplay playsinline></video>
    <div id="status">⏳ वीडियो लोड हो रहा है...</div>
</div>

<!-- Shaka Player CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.10/shaka-player.compiled.js"></script>

<!-- mux.js (HLS के लिए) -->
<script src="https://cdn.jsdelivr.net/npm/mux.js@latest/dist/mux.min.js"></script>

<script>
    (function() {
        const videoElement = document.getElementById('videoElement');
        const statusDiv = document.getElementById('status');

        // 🔴🔴🔴 अपना REAL .m3u8 लिंक यहाँ डालें 🔴🔴🔴
        const MANIFEST_URL = 'https://vs.classplusapp.com/hls/6a7089aae86acfbc9dbb33f5/index.m3u8';

        // ✅ CORS Proxy (ClassPlus के CORS को बायपास करने के लिए)
        const CORS_PROXY = 'https://corsproxy.io/?url=';

        function updateStatus(msg, type) {
            statusDiv.textContent = msg;
            statusDiv.className = type || '';
        }

        // ============================================================
        // 🔧 Shaka Player को CORS Proxy के साथ कॉन्फ़िगर करें
        // ============================================================
        function initShakaPlayer() {
            const player = new shaka.Player(videoElement);

            // ✅ CORS Proxy को Shaka के Network Engine में add करें
            const originalRequest = shaka.net.HttpFetchPlugin.prototype.request;
            shaka.net.HttpFetchPlugin.prototype.request = function(uri, request) {
                // अगर URL .m3u8 या .ts से खत्म होता है तो Proxy से जोड़ें
                if (uri.includes('.m3u8') || uri.includes('.ts')) {
                    const proxyUrl = CORS_PROXY + encodeURIComponent(uri);
                    console.log('🔄 Proxy URL:', proxyUrl);
                    return originalRequest.call(this, proxyUrl, request);
                }
                return originalRequest.call(this, uri, request);
            };

            // ✅ VLC जैसी स्मूद स्ट्रीमिंग के लिए कॉन्फ़िगरेशन
            player.configure({
                streaming: {
                    bufferingGoal: 45,
                    rebufferingGoal: 15,
                    bufferBehind: 30,
                    retryParameters: {
                        maxAttempts: 10,
                        timeout: 15000,
                        baseDelay: 1000,
                        backoffFactor: 2
                    },
                    hls: {
                        allowMp2t: true,
                        useNativeHls: false
                    },
                    lowLatencyMode: true,
                    infiniteLiveStreamDuration: true
                },
                manifest: {
                    hls: {
                        liveSegmentsDelay: 2
                    },
                    ignoreManifestTextInfoFailures: true,
                    ignoreTextStreamFailures: true
                },
                abr: {
                    enabled: true,
                    switchInterval: 3,
                    bandwidthUpgradeTarget: 0.7,
                    bandwidthDowngradeTarget: 0.8
                }
            });

            // ✅ Error Handling
            player.addEventListener('error', function(event) {
                const error = event.detail;
                console.error('❌ Shaka Error:', error);

                // Error 3016 = CORS Error
                if (error.code === 3016) {
                    updateStatus('❌ CORS Error: ClassPlus सर्वर ने रिक्वेस्ट ब्लॉक कर दी। Proxy का उपयोग किया जा रहा है...', 'error');
                    // Proxy के साथ दोबारा कोशिश
                    setTimeout(() => {
                        loadVideo(player);
                    }, 2000);
                } else {
                    updateStatus('❌ Error: ' + error.message, 'error');
                }
            });

            // ✅ Buffering State
            player.addEventListener('buffering', function(event) {
                if (event.buffering) {
                    updateStatus('⏳ बफर हो रहा है...', 'loading');
                } else {
                    updateStatus('✅ लाइव चल रहा है', '');
                }
            });

            // ✅ वीडियो लोड करें
            function loadVideo(p) {
                updateStatus('🔄 वीडियो लोड हो रहा है...', 'loading');
                p.load(MANIFEST_URL, null, 'application/x-mpegURL')
                    .then(() => {
                        updateStatus('✅ लाइव चल रहा है', '');
                        console.log('✅ Shaka Player Loaded Successfully!');
                    })
                    .catch((err) => {
                        console.error('❌ Load Error:', err);
                        if (err.code === 3016) {
                            updateStatus('❌ CORS Error: Proxy भी काम नहीं कर रहा। नया लिंक डालें या कोई दूसरा Proxy try करें।', 'error');
                        } else {
                            updateStatus('❌ ' + err.message, 'error');
                        }
                    });
            }

            // Start Loading
            loadVideo(player);

            // 🔄 अगर वीडियो रुक जाए तो Auto-Retry (हर 10 सेकंड में चेक)
            setInterval(() => {
                if (videoElement.paused && videoElement.currentTime > 0 && !videoElement.ended && videoElement.readyState < 2) {
                    console.log('🔄 वीडियो रुका हुआ है, रिलोड कर रहे हैं...');
                    updateStatus('🔄 वीडियो रिलोड किया जा रहा है...', 'loading');
                    loadVideo(player);
                }
            }, 10000);
        }

        // ============================================================
        // 🚀 Shaka Player को Initialize करें
        // ============================================================
        // Shaka Player Load होने का इंतज़ार करें
        if (typeof shaka !== 'undefined' && shaka.Player) {
            initShakaPlayer();
        } else {
            // अगर Shaka Load न हो तो इंतज़ार करें
            const checkShaka = setInterval(() => {
                if (typeof shaka !== 'undefined' && shaka.Player) {
                    clearInterval(checkShaka);
                    initShakaPlayer();
                }
            }, 500);
        }

        console.log('✅ Shaka Player + CORS Proxy Setup Complete!');
        console.log('📺 Link:', MANIFEST_URL);
    })();
</script>
</body>
</html>
