<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>लाइव स्ट्रीम - HLS Player</title>
    <style>
        /* Reset & Base */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid #2a2a4e;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .live-badge {
            background: #ff0000;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            animation: blink 1.2s infinite;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .live-badge::before {
            content: "●";
            font-size: 18px;
            animation: pulse 1s infinite;
        }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
        @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.8); } }

        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16/9;
            width: 100%;
        }
        #videoPlayer {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            padding: 12px 18px;
            background: #12122a;
            border-radius: 12px;
            border: 1px solid #2a2a4e;
            flex-wrap: wrap;
            gap: 10px;
        }
        .viewer-count {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
        }
        .viewer-count .number {
            font-weight: 800;
            font-size: 22px;
            background: linear-gradient(135deg, #00c6fb, #005bea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        .status-text { color: #00ff88; font-weight: 600; font-size: 15px; }

        .input-section {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .input-section input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid #2a2a4e;
            background: #0f0f23;
            color: #fff;
            font-size: 15px;
            min-width: 200px;
            outline: none;
        }
        .input-section input:focus { border-color: #f7971e; }
        .input-section button {
            padding: 12px 28px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #0a0a0a;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .input-section button:hover { transform: scale(1.04); box-shadow: 0 8px 30px rgba(247,151,30,0.4); }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #555;
            font-size: 13px;
            border-top: 1px solid #1a1a3e;
            padding-top: 18px;
        }
        .error-msg {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 8px;
            padding: 10px 16px;
            background: rgba(255,0,0,0.1);
            border-radius: 10px;
            border-left: 3px solid #ff6b6b;
            display: none;
        }
        .error-msg.show { display: block; }
        .success-msg {
            color: #00ff88;
            font-size: 14px;
            margin-top: 8px;
            padding: 10px 16px;
            background: rgba(0,255,136,0.1);
            border-radius: 10px;
            border-left: 3px solid #00ff88;
            display: none;
        }
        .success-msg.show { display: block; }

        @media (max-width: 600px) {
            .container { padding: 15px; }
            .header h1 { font-size: 18px; }
            .status-bar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>📺 लाइव स्ट्रीम</h1>
            <div class="live-badge">लाइव</div>
        </div>

        <div class="video-wrapper">
            <video id="videoPlayer" controls playsinline autoplay preload="auto"></video>
        </div>

        <div class="status-bar">
            <div class="viewer-count">
                <span class="status-dot"></span>
                <span class="status-text" id="statusText">लाइव चल रहा है</span>
            </div>
            <div class="viewer-count">
                <span class="label">👁️ देख रहे हैं:</span>
                <span class="number" id="viewerCount">0</span>
            </div>
        </div>

        <div class="input-section">
            <input type="text" id="videoUrlInput" placeholder="यहाँ .m3u8 लिंक पेस्ट करें..." />
            <button onclick="loadManualLink()">🎬 लोड करें</button>
        </div>

        <div id="successMsg" class="success-msg">✅ वीडियो लोड हो गया!</div>
        <div id="errorMsg" class="error-msg">❌ वीडियो लोड नहीं हुआ।</div>
        <div class="footer">⚡ HLS.js Player | VLC जैसा अनुभव</div>
    </div>

    <!-- hls.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        // ============================================================
        // 🔴🔴🔴 APNA REAL .m3u8 LINK YAHAN DAALEIN 🔴🔴🔴
        // ============================================================
        const DEFAULT_VIDEO_URL = "https://vs.classplusapp.com/hls/6a7089aae86acfbc9dbb33f5/index.m3u8";

        let hls = null;
        let retryCount = 0;
        const MAX_RETRIES = 999;

        const video = document.getElementById('videoPlayer');
        const viewerCountEl = document.getElementById('viewerCount');
        const statusText = document.getElementById('statusText');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const inputField = document.getElementById('videoUrlInput');

        // ============================================================
        // 👁️ Viewer Count (Simulated)
        // ============================================================
        function startViewerCounter() {
            let count = Math.floor(Math.random() * 40) + 12;
            viewerCountEl.textContent = count;
            setInterval(() => {
                let change = Math.floor(Math.random() * 7) - 3;
                let newCount = parseInt(viewerCountEl.textContent) + change;
                if (newCount < 5) newCount = 5 + Math.floor(Math.random() * 10);
                if (newCount > 150) newCount = 120 + Math.floor(Math.random() * 30);
                viewerCountEl.textContent = newCount;
            }, 7000);
        }
        startViewerCounter();

        // ============================================================
        // 🎬 VLC जैसा HLS Player - hls.js
        // ============================================================
        function loadVideo(url) {
            if (!url || url.trim() === "") {
                showError("❌ कृपया एक वैध लिंक डालें!");
                return;
            }

            hideAllMessages();
            statusText.textContent = "⏳ लोड हो रहा है...";

            if (hls) {
                hls.destroy();
                hls = null;
            }

            // Safari / iOS - Native HLS
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play().catch(function(e) {
                    console.warn('Autoplay blocked:', e);
                });
                showSuccess("✅ वीडियो लोड हो गया!");
                return;
            }

            // ✅ hls.js - VLC जैसी सेटिंग्स
            if (Hls.isSupported()) {
                hls = new Hls({

                    // 🟢 Adaptive Bitrate (ABR) - VLC की tarah
                    abrEwmaDefaultEstimate: 500000,
                    abrEwmaFastLive: 3.0,
                    abrEwmaSlowLive: 9.0,

                    // 🟢 Buffer Settings - VLC ki tarah pehle se load karein
                    maxBufferLength: 60,           // 60 second buffer
                    maxMaxBufferLength: 120,
                    maxBufferSize: 60 * 1000 * 1000,
                    startFragPrefetch: true,       // Pehle se load karna shuru karein

                    // 🟢 Live Stream Settings
                    liveDurationInfinity: true,
                    liveMaxLatencyDurationCount: 10,
                    liveSyncDurationCount: 10,

                    // 🟢 Retry Logic - VLC ki tarah
                    fragLoadingTimeOut: 60000,
                    manifestLoadingTimeOut: 60000,
                    levelLoadingTimeOut: 60000,

                    // 🟢 Low Latency Mode
                    lowLatencyMode: true,
                    enableWorker: true,
                    testBandwidth: true
                });

                hls.loadSource(url);
                hls.attachMedia(video);

                // ✅ Manifest Parse Ho Gaya
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    console.log('✅ MANIFEST PARSED');
                    statusText.textContent = "✅ लाइव चल रहा है";
                    showSuccess("✅ वीडियो लोड हो गया!");
                    video.play().catch(function(e) {
                        console.warn('Autoplay blocked:', e);
                    });
                });

                // ✅ Fragment Loaded - Har segment load hone par
                hls.on(Hls.Events.FRAG_LOADED, function() {
                    console.log('✅ FRAGMENT LOADED');
                    statusText.textContent = "✅ लाइव चल रहा है";
                    hideAllMessages();
                });

                // ✅ Buffer Stalled - VLC ki tarah recover
                hls.on(Hls.Events.BUFFER_STALLED, function() {
                    console.log('🔄 BUFFER STALLED, recovering...');
                    statusText.textContent = "🔄 बफर हो रहा है...";
                    setTimeout(() => {
                        if (hls) {
                            hls.startLoad();
                        }
                    }, 1000);
                });

                // ✅ Error Recovery - VLC ki tarah retry
                hls.on(Hls.Events.ERROR, function(event, data) {
                    console.log('⚠️ ERROR:', data.type, data.details);

                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.log('🔄 NETWORK ERROR, recovering...');
                                statusText.textContent = "🔄 कनेक्शन पुनः स्थापित...";
                                setTimeout(() => {
                                    if (hls) hls.startLoad();
                                }, 1000);
                                break;

                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.log('🔄 MEDIA ERROR, recovering...');
                                statusText.textContent = "🔄 मीडिया पुनः लोड...";
                                setTimeout(() => {
                                    if (hls) hls.recoverMediaError();
                                }, 1000);
                                break;

                            default:
                                if (retryCount < MAX_RETRIES) {
                                    retryCount++;
                                    console.log(`🔄 Retry ${retryCount}/${MAX_RETRIES}...`);
                                    statusText.textContent = `🔄 पुनः प्रयास ${retryCount}...`;
                                    setTimeout(function() {
                                        loadVideo(url);
                                    }, 2000);
                                } else {
                                    showError("❌ वीडियो नहीं चल रहा। नया लिंक डालें।");
                                    statusText.textContent = "❌ वीडियो नहीं चल रहा";
                                }
                                break;
                        }
                    } else {
                        // Non-fatal error - VLC ki tarah ignore
                        if (data.details === 'fragLoadError' || data.details === 'fragParsingError') {
                            console.log('🔄 Fragment error, retrying...');
                            setTimeout(() => {
                                if (hls) hls.startLoad();
                            }, 1000);
                        }
                    }
                });

            } else {
                showError("❌ आपका ब्राउज़र HLS सपोर्ट नहीं करता।");
                statusText.textContent = "❌ ब्राउज़र सपोर्ट नहीं करता";
            }
        }

        // ============================================================
        // 🔧 Manual Link Load
        // ============================================================
        function loadManualLink() {
            const url = inputField.value.trim();
            if (url) {
                retryCount = 0;
                loadVideo(url);
                localStorage.setItem('savedLink', url);
            } else {
                showError("❌ कृपया पहले लिंक डालें!");
            }
        }

        inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') loadManualLink();
        });

        // ============================================================
        // 🚀 Page Load - Default Link
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const savedLink = localStorage.getItem('savedLink');
            let linkToLoad = DEFAULT_VIDEO_URL;

            if (savedLink && savedLink !== "null" && savedLink !== "") {
                linkToLoad = savedLink;
                inputField.value = savedLink;
            } else {
                inputField.value = DEFAULT_VIDEO_URL;
            }

            if (linkToLoad && linkToLoad !== "https://example.com/stream.m3u8") {
                loadVideo(linkToLoad);
            } else {
                showError("❌ DEFAULT_VIDEO_URL में .m3u8 लिंक डालें।");
                statusText.textContent = "❌ कोई लिंक नहीं";
            }
        });

        // ============================================================
        // 🔄 Auto-Retry - Video Stalled Ho toh Reload (VLC ki tarah)
        // ============================================================
        setInterval(function() {
            if (!video) return;
            // Agar video paused hai, currentTime > 0, aur readyState < 2 (buffering)
            if (video.paused && video.currentTime > 0 && !video.ended && video.readyState < 2) {
                console.log('🔄 Video stalled, reloading...');
                statusText.textContent = "🔄 पुनः लोड...";
                const currentSrc = localStorage.getItem('savedLink') || DEFAULT_VIDEO_URL;
                if (currentSrc) {
                    loadVideo(currentSrc);
                }
            }
        }, 5000);

        // ============================================================
        // 📢 UI Helper Functions
        // ============================================================
        function hideAllMessages() {
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('show');
            successMsg.classList.remove('show');
        }

        function showSuccess(msg) {
            successMsg.textContent = msg;
            successMsg.classList.add('show');
            errorMsg.classList.remove('show');
        }

        console.log('✅ HLS.js Player Ready!');
        console.log('📺 Default Link:', DEFAULT_VIDEO_URL);
        console.log('💡 Ye Player VLC ki tarah ABR, Buffering, Retry, Cache sab handle karta hai.');
    </script>

</body>
</html>
