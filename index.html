<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Shaka Player Example - Live Stream</title>
    <style>
        /* बस एक बेसिक स्टाइल */
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        #video-container {
            width: 90%;
            max-width: 1000px;
            background: #000;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            background: #000;
        }
        #status {
            color: #00ff88;
            padding: 10px 15px;
            background: #111;
            text-align: center;
            font-size: 14px;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

<div id="video-container">
    <!-- यहाँ वीडियो दिखेगा -->
    <video id="videoElement" controls autoplay playsinline></video>
    <div id="status">⏳ वीडियो लोड हो रहा है...</div>
</div>

<!-- 1. Shaka Player Library (CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.10/shaka-player.compiled.js"></script>

<!-- 2. mux.js Library (HLS के लिए ज़रूरी) -->
<script src="https://cdn.jsdelivr.net/npm/mux.js@latest/dist/mux.min.js"></script>

<script>
    (function() {
        const videoElement = document.getElementById('videoElement');
        const statusDiv = document.getElementById('status');

        // 🔴 🔴 🔴 अपना REAL .m3u8 लिंक यहाँ डालें 🔴 🔴 🔴
        const MANIFEST_URL = 'https://vs.classplusapp.com/hls/6a7089aae86acfbc9dbb33f5/index.m3u8';

        // Shaka Player इनिशियलाइज़ करें
        const player = new shaka.Player(videoElement);

        // --- VLC जैसी स्मूद स्ट्रीमिंग के लिए ख़ास कॉन्फ़िगरेशन ---
        // ये सेटिंग्स बार-बार रुकने (buffering) की समस्या को कम करती हैं [citation:2][citation:5][citation:9]
        player.configure({
            streaming: {
                // बफर Goal बढ़ाएँ (जितना Data पहले से लोड होगा, उतना कम रुकेगा)
                bufferingGoal: 30,          // 30 सेकंड का बफर लोड करेगा
                rebufferingGoal: 10,        // अगर बफर 10 सेकंड से कम हो तो दोबारा लोड करे
                // HLS के लिए ख़ास सेटिंग्स
                hls: {
                    allowMp2t: true,        // MPEG-TS format को अनुमति दें
                    useNativeHls: false     // JavaScript पार्सर का इस्तेमाल करें (ज्यादा कंट्रोल के लिए)
                },
                // Retry Parameters: अगर कोई सेगमेंट लोड न हो तो 5 बार दोबारा कोशिश करे [citation:2]
                retryParameters: {
                    maxAttempts: 5,
                    timeout: 10000,         // 10 सेकंड का टाइमआउट
                    baseDelay: 1000         // हर कोशिश के बीच 1 सेकंड का गैप
                },
                // लाइव स्ट्रीम के लिए सही सेटिंग्स [citation:5]
                lowLatencyMode: true,
                infiniteLiveStreamDuration: true
            },
            manifest: {
                // HLS मैनिफेस्ट में थोड़ी देर और सेगमेंट रखें
                hls: {
                    liveSegmentsDelay: 1.5
                },
                // अगर कोई टेक्स्ट (जैसे subtitles) लोड न हो तो उसे इग्नोर करें [citation:2]
                ignoreManifestTextInfoFailures: true,
                ignoreTextStreamFailures: true
            },
            // ABR (Adaptive Bitrate) सेटिंग्स [citation:5]
            abr: {
                enabled: true,
                switchInterval: 5,          // 5 सेकंड में एक बार बिटरेट चेक करे
                bandwidthUpgradeTarget: 0.7,
                bandwidthDowngradeTarget: 0.8
            }
        });

        // --- Error Handling: अगर कोई एरर आए तो रिकवर करें ---
        player.addEventListener('error', function(event) {
            const error = event.detail;
            console.error('Shaka Player Error:', error);
            statusDiv.innerHTML = '❌ वीडियो लोड करने में समस्या: ' + error.message;
            // 🔄 अगर नेटवर्क एरर है तो दोबारा लोड करने की कोशिश करें [citation:2]
            if (error.code === shaka.util.Error.Code.BAD_HTTP_STATUS) {
                statusDiv.innerHTML = '🔄 लिंक एक्सपायर हो सकता है, दोबारा कोशिश कर रहे हैं...';
                player.load(MANIFEST_URL).catch(onLoadError);
            }
        });

        // --- बफरिंग स्टेट को मॉनिटर करें ---
        player.addEventListener('buffering', function(event) {
            if (event.buffering) {
                statusDiv.innerHTML = '⏳ बफर हो रहा है, कृपया रुकें...';
                // अगर बहुत देर तक बफर कर रहा है तो रिट्राई करें [citation:2]
                setTimeout(function() {
                    if (player.isBuffering()) {
                        statusDiv.innerHTML = '🔄 स्ट्रीम रिट्राई की जा रही है...';
                        player.retryStreaming();
                    }
                }, 5000);
            } else {
                statusDiv.innerHTML = '✅ लाइव चल रहा है';
            }
        });

        // --- वीडियो लोड करें ---
        function onLoadError(error) {
            console.error('Load Error:', error);
            statusDiv.innerHTML = '❌ वीडियो लोड नहीं हो पाया। कृपया पेज रिफ्रेश करें या नया लिंक डालें।';
        }

        player.load(MANIFEST_URL, null, 'application/x-mpegURL')
            .then(() => {
                statusDiv.innerHTML = '✅ लाइव चल रहा है';
                console.log('✅ Shaka Player Loaded Successfully!');
            })
            .catch(onLoadError);

        // --- Browser's Native Controls को Enable करें (जैसे Fullscreen, Volume) ---
        videoElement.controls = true;

    })();
</script>
</body>
</html>
