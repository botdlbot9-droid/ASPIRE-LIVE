<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लाइव स्ट्रीम</title>
    <style>
        /* ============================================================
           CSS - पूरा स्टाइल
           ============================================================ */

        /* ----- Reset & Base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a2a4e;
        }

        /* ----- Header ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .live-badge {
            background: #ff0000;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            animation: blink 1.2s infinite;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-badge::before {
            content: "●";
            font-size: 18px;
            animation: pulse 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        /* ----- Video ----- */
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            width: 100%;
        }

        #videoPlayer {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }

        /* ----- Status Bar ----- */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            padding: 12px 18px;
            background: #12122a;
            border-radius: 12px;
            border: 1px solid #2a2a4e;
            flex-wrap: wrap;
            gap: 10px;
        }

        .viewer-count {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
        }

        .viewer-count .number {
            font-weight: 800;
            font-size: 22px;
            background: linear-gradient(135deg, #00c6fb, #005bea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        .status-text {
            color: #00ff88;
            font-weight: 600;
            font-size: 15px;
        }

        /* ----- Input Section ----- */
        .input-section {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .input-section input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid #2a2a4e;
            background: #0f0f23;
            color: #fff;
            font-size: 15px;
            min-width: 200px;
            outline: none;
            transition: 0.3s;
        }

        .input-section input:focus {
            border-color: #f7971e;
            box-shadow: 0 0 20px rgba(247, 151, 30, 0.15);
        }

        .input-section input::placeholder {
            color: #666;
        }

        .input-section button {
            padding: 12px 28px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #0a0a0a;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .input-section button:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 30px rgba(247, 151, 30, 0.4);
        }

        /* ----- Messages ----- */
        .message {
            font-size: 14px;
            margin-top: 8px;
            padding: 10px 16px;
            border-radius: 10px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.error {
            color: #ff6b6b;
            background: rgba(255, 0, 0, 0.1);
            border-left: 3px solid #ff6b6b;
        }

        .message.success {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
            border-left: 3px solid #00ff88;
        }

        .message.info {
            color: #f7971e;
            background: rgba(247, 151, 30, 0.1);
            border-left: 3px solid #f7971e;
        }

        /* ----- Footer ----- */
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #555;
            font-size: 13px;
            border-top: 1px solid #1a1a3e;
            padding-top: 18px;
        }

        /* ----- Responsive ----- */
        @media (max-width: 600px) {
            .container { padding: 15px; }
            .header h1 { font-size: 18px; }
            .status-bar { flex-direction: column; align-items: flex-start; }
            .input-section input { min-width: 100%; }
            .input-section button { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ===== HEADER ===== -->
        <div class="header">
            <h1>📺 लाइव स्ट्रीम</h1>
            <div class="live-badge">लाइव</div>
        </div>

        <!-- ===== VIDEO PLAYER ===== -->
        <div class="video-wrapper">
            <video id="videoPlayer" controls playsinline autoplay preload="auto"></video>
        </div>

        <!-- ===== STATUS BAR ===== -->
        <div class="status-bar">
            <div class="viewer-count">
                <span class="status-dot"></span>
                <span class="status-text" id="statusText">लाइव चल रहा है</span>
            </div>
            <div class="viewer-count">
                <span class="label">👁️ देख रहे हैं:</span>
                <span class="number" id="viewerCount">0</span>
            </div>
        </div>

        <!-- ===== INPUT SECTION ===== -->
        <div class="input-section">
            <input type="text" id="videoUrlInput" placeholder="यहाँ .m3u8 लिंक पेस्ट करें..." />
            <button onclick="loadManualLink()">🎬 लोड करें</button>
        </div>

        <!-- ===== MESSAGE AREA ===== -->
        <div id="message" class="message"></div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            ⚡ hls.js प्लेयर | <span id="playerInfo">तैयार</span>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- hls.js LIBRARY (CDN) -->
    <!-- ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest">
    </script>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT - Direct hls.js (No iframe, No Livepush) -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // 🔴🔴🔴 अपना REAL .m3u8 लिंक यहाँ डालें 🔴🔴🔴
        // ============================================================
        const DEFAULT_VIDEO_URL = "https://vs.classplusapp.com/hls/6a7089aae86acfbc9dbb33f5/index.m3u8";

        // ============================================================
        // VARIABLES
        // ============================================================
        let hls = null;
        let retryCount = 0;
        const MAX_RETRIES = 999;
        let isManualLoad = false;
        let currentUrl = DEFAULT_VIDEO_URL;

        const video = document.getElementById('videoPlayer');
        const viewerCountEl = document.getElementById('viewerCount');
        const statusText = document.getElementById('statusText');
        const messageEl = document.getElementById('message');
        const inputField = document.getElementById('videoUrlInput');
        const playerInfo = document.getElementById('playerInfo');

        // ============================================================
        // 👁️ VIEWER COUNTER (Simulated)
        // ============================================================
        function startViewerCounter() {
            let count = Math.floor(Math.random() * 40) + 12;
            viewerCountEl.textContent = count;
            setInterval(() => {
                let change = Math.floor(Math.random() * 7) - 3;
                let newCount = parseInt(viewerCountEl.textContent) + change;
                if (newCount < 5) newCount = 5 + Math.floor(Math.random() * 10);
                if (newCount > 150) newCount = 120 + Math.floor(Math.random() * 30);
                viewerCountEl.textContent = newCount;
            }, 7000);
        }
        startViewerCounter();

        // ============================================================
        // 📢 MESSAGE HELPER
        // ============================================================
        function showMessage(msg, type) {
            messageEl.textContent = msg;
            messageEl.className = 'message show ' + (type || 'info');
            if (type === 'success' || type === 'info') {
                clearTimeout(messageEl._hideTimer);
                messageEl._hideTimer = setTimeout(() => {
                    messageEl.classList.remove('show');
                }, 5000);
            }
        }

        function hideMessage() {
            messageEl.classList.remove('show');
            clearTimeout(messageEl._hideTimer);
        }

        // ============================================================
        // 🎬 LOAD VIDEO - Direct hls.js (Livepush-style proxy)
        // ============================================================
        function loadVideo(url) {
            if (!url || url.trim() === "") {
                showMessage("❌ कृपया एक वैध .m3u8 लिंक डालें!", "error");
                return;
            }

            currentUrl = url;
            hideMessage();
            statusText.textContent = "⏳ लोड हो रहा है...";
            playerInfo.textContent = "लोड हो रहा...";

            if (hls) {
                hls.destroy();
                hls = null;
            }

            // ============================================================
            // SAFARI / iOS - Native HLS
            // ============================================================
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play().catch(function(e) {
                    console.warn('Autoplay blocked:', e);
                    showMessage("⚠️ ऑटोप्ले ब्लॉक हुआ, प्ले बटन दबाएँ", "info");
                });
                statusText.textContent = "✅ लाइव चल रहा है (Native)";
                playerInfo.textContent = "Safari Native Player";
                showMessage("✅ वीडियो लोड हो गया!", "success");
                return;
            }

            // ============================================================
            // hls.js - Direct (Livepush-style proxy with custom headers)
            // ============================================================
            if (Hls.isSupported()) {
                try {
                    hls = new Hls({
                        // Performance settings
                        enableWorker: true,
                        lowLatencyMode: true,
                        maxBufferLength: 60,
                        maxMaxBufferLength: 120,
                        maxBufferSize: 60 * 1000 * 1000,
                        startFragPrefetch: true,

                        // Live stream settings
                        liveDurationInfinity: true,
                        liveMaxLatencyDurationCount: 10,
                        liveSyncDurationCount: 10,

                        // Timeout settings
                        fragLoadingTimeOut: 60000,
                        manifestLoadingTimeOut: 60000,
                        levelLoadingTimeOut: 60000,

                        // ABR settings
                        abrEwmaDefaultEstimate: 500000,
                        abrEwmaFastLive: 3.0,
                        abrEwmaSlowLive: 9.0,
                        testBandwidth: true,

                        // ⭐ Extension जैसा behaviour - extra headers
                        xhrSetup: function(xhr, url) {
                            // Livepush की तरह headers
                            xhr.setRequestHeader('Referer', 'https://livepush.io/');
                            xhr.setRequestHeader('Origin', 'https://livepush.io/');
                            xhr.setRequestHeader('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36');
                            xhr.withCredentials = true;
                            console.log('📡 XHR Headers set for:', url);
                        }
                    });

                    hls.loadSource(url);
                    hls.attachMedia(video);

                    // ✅ MANIFEST PARSED
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        console.log('✅ MANIFEST PARSED');
                        statusText.textContent = "✅ लाइव चल रहा है";
                        playerInfo.textContent = "hls.js v" + Hls.version;
                        showMessage("✅ वीडियो लोड हो गया!", "success");
                        video.play().catch(function(e) {
                            console.warn('Autoplay blocked:', e);
                            showMessage("⚠️ ऑटोप्ले ब्लॉक हुआ, प्ले बटन दबाएँ", "info");
                        });
                    });

                    // ✅ FRAGMENT LOADED
                    hls.on(Hls.Events.FRAG_LOADED, function() {
                        statusText.textContent = "✅ लाइव चल रहा है";
                        hideMessage();
                    });

                    // ✅ BUFFER STALLED
                    hls.on(Hls.Events.BUFFER_STALLED, function() {
                        console.log('🔄 BUFFER STALLED, recovering...');
                        statusText.textContent = "🔄 बफर हो रहा है...";
                        showMessage("🔄 बफर रिफ्रेश किया जा रहा है...", "info");
                        setTimeout(() => {
                            if (hls) {
                                hls.startLoad();
                            }
                        }, 1000);
                    });

                    // ✅ ERROR HANDLING
                    hls.on(Hls.Events.ERROR, function(event, data) {
                        console.log('⚠️ ERROR:', data.type, data.details);

                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    console.log('🔄 NETWORK ERROR, recovering...');
                                    statusText.textContent = "🔄 कनेक्शन पुनः स्थापित...";
                                    showMessage("🔄 कनेक्शन पुनः स्थापित किया जा रहा है...", "info");
                                    setTimeout(() => {
                                        if (hls) hls.startLoad();
                                    }, 1000);
                                    break;

                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    console.log('🔄 MEDIA ERROR, recovering...');
                                    statusText.textContent = "🔄 मीडिया पुनः लोड...";
                                    showMessage("🔄 मीडिया पुनः लोड किया जा रहा है...", "info");
                                    setTimeout(() => {
                                        if (hls) hls.recoverMediaError();
                                    }, 1000);
                                    break;

                                default:
                                    if (retryCount < MAX_RETRIES) {
                                        retryCount++;
                                        console.log(`🔄 Retry ${retryCount}/${MAX_RETRIES}...`);
                                        statusText.textContent = `🔄 पुनः प्रयास ${retryCount}...`;
                                        showMessage(`🔄 पुनः प्रयास ${retryCount}...`, "info");
                                        setTimeout(function() {
                                            loadVideo(url);
                                        }, 2000);
                                    } else {
                                        showMessage("❌ वीडियो नहीं चल रहा। नया लिंक डालें।", "error");
                                        statusText.textContent = "❌ वीडियो नहीं चल रहा";
                                        playerInfo.textContent = "Error";
                                    }
                                    break;
                            }
                        } else {
                            if (data.details === 'fragLoadError' || data.details === 'fragParsingError') {
                                console.log('🔄 Fragment error, retrying...');
                                setTimeout(() => {
                                    if (hls) hls.startLoad();
                                }, 1000);
                            }
                        }
                    });

                    // ✅ LEVEL LOADED - Quality Info
                    hls.on(Hls.Events.LEVEL_LOADED, function(event, data) {
                        if (data && data.details) {
                            const level = data.details;
                            const height = level.height || '?';
                            const width = level.width || '?';
                            const bitrate = level.averageBitrate ? (level.averageBitrate / 1000).toFixed(0) : '?';
                            playerInfo.textContent = `${width}x${height} @ ${bitrate}kbps`;
                        }
                    });

                } catch (error) {
                    console.error('❌ hls.js Error:', error);
                    showMessage("❌ प्लेयर शुरू नहीं हो पाया: " + error.message, "error");
                    statusText.textContent = "❌ प्लेयर एरर";
                }

            } else {
                showMessage("❌ आपका ब्राउज़र HLS सपोर्ट नहीं करता।", "error");
                statusText.textContent = "❌ ब्राउज़र सपोर्ट नहीं करता";
            }
        }

        // ============================================================
        // 🔧 MANUAL LINK LOAD
        // ============================================================
        function loadManualLink() {
            const url = inputField.value.trim();
            if (url) {
                isManualLoad = true;
                retryCount = 0;
                loadVideo(url);
                localStorage.setItem('savedLink', url);
                showMessage("✅ नया लिंक लोड किया जा रहा है...", "info");
            } else {
                showMessage("❌ कृपया पहले लिंक डालें!", "error");
            }
        }

        inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadManualLink();
            }
        });

        // ============================================================
        // 🚀 PAGE LOAD - DEFAULT LINK
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const savedLink = localStorage.getItem('savedLink');
            let linkToLoad = DEFAULT_VIDEO_URL;

            if (savedLink && savedLink !== "null" && savedLink !== "") {
                linkToLoad = savedLink;
                inputField.value = savedLink;
            } else {
                inputField.value = DEFAULT_VIDEO_URL;
            }

            if (linkToLoad && linkToLoad !== "https://example.com/stream.m3u8") {
                loadVideo(linkToLoad);
            } else {
                showMessage("❌ DEFAULT_VIDEO_URL में .m3u8 लिंक डालें।", "error");
                statusText.textContent = "❌ कोई लिंक नहीं";
            }

            if (typeof Hls !== 'undefined' && Hls.version) {
                console.log('📦 hls.js v' + Hls.version);
            }
        });

        // ============================================================
        // 🔄 AUTO-RETRY
        // ============================================================
        setInterval(function() {
            if (!video) return;

            if (video.paused && video.currentTime > 0 && !video.ended && video.readyState < 2 && !isManualLoad) {
                console.log('🔄 Video stalled, reloading...');
                statusText.textContent = "🔄 पुनः लोड...";
                showMessage("🔄 वीडियो पुनः लोड किया जा रहा है...", "info");
                const currentSrc = localStorage.getItem('savedLink') || DEFAULT_VIDEO_URL;
                if (currentSrc) {
                    loadVideo(currentSrc);
                }
            }

            if (video.buffered.length > 0 && !video.paused && !isManualLoad) {
                const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                const currentTime = video.currentTime;
                if (bufferedEnd - currentTime < 3 && video.readyState < 3) {
                    console.log('🔄 Buffer low, reloading...');
                    statusText.textContent = "🔄 बफर रिफ्रेश...";
                    const currentSrc = localStorage.getItem('savedLink') || DEFAULT_VIDEO_URL;
                    if (currentSrc) {
                        loadVideo(currentSrc);
                    }
                }
            }
        }, 5000);

        // ============================================================
        // 📊 CONSOLE INFO
        // ============================================================
        console.log('✅ hls.js Player Ready!');
        console.log('📺 Default Link:', DEFAULT_VIDEO_URL);
        console.log('🔗 GitHub: https://github.com/video-dev/hls.js');
        console.log('💡 Ye player Livepush-style headers use kar raha hai.');
    </script>

</body>
</html>
